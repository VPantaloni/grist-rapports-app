# Pages de la forge (forge.apps.education.fr) : publie le dossier site/ tel quel, sans build.
# Adresse : https://widget.forge.apps.education.fr/grist-rapports-app/ (projet dans le groupe « widget »).
pages:
  image: alpine:latest
  script:
    - rm -rf public
    - cp -r site public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
