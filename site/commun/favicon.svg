<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Icône de l'onglet, pour toutes les pages : <link rel="icon" type="image/svg+xml" href="../commun/favicon.svg">.
       À ADAPTER : couleur d'accent (fill du carré, comme la variable accent de style.css) et icône Lucide (https://lucide.dev,
       licence ISC) dans le <g>. Par défaut : « layout-grid ». -->
  <rect width="32" height="32" rx="7" fill="#5b21a3"/>
  <g transform="translate(4 4)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/>
    <rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>
  </g>
</svg>
