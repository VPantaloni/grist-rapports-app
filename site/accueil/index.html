<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapports et suivis — Accueil pour Grist</title>
<link rel="icon" type="image/svg+xml" href="../commun/favicon.svg?v=2">
<link rel="stylesheet" href="../commun/style.css">
<style>
  :root { --violet-1: #5b21a3; --violet-2: #7c3aed; --violet-3: #a78bfa; --carte: var(--bg); --teinte: #f3edfc; }
  @media (prefers-color-scheme: dark) { :root { --carte: #24222d; --teinte: #2e2147; } }
  body { background: var(--bg2); }
  #app { flex: 1; overflow-y: auto; }
  .page { max-width: 1120px; margin: 0 auto; padding: 18px 20px 40px; position: relative; }
  #aide { position: absolute; top: 26px; right: 30px; z-index: 2; border-radius: 50%; width: 30px; height: 30px; display: flex;
    align-items: center; justify-content: center; text-decoration: none; color: #fff; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); }
  #aide:hover { background: rgba(255,255,255,.3); }
  .bandeau { position: relative; overflow: hidden; border-radius: 16px; padding: 26px 28px 24px; color: #fff;
    background: radial-gradient(120% 140% at 100% 0%, var(--violet-3) 0%, transparent 45%), linear-gradient(135deg, var(--violet-1) 0%, var(--violet-2) 100%);
    box-shadow: 0 10px 30px rgba(91, 33, 163, .25); }
  .bandeau::after { content: ''; position: absolute; right: -60px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%;
    border: 36px solid rgba(255,255,255,.08); }
  .bandeau .sur { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .bandeau h1 { font-size: 28px; margin: 4px 0 6px; font-weight: 700; }
  .bandeau p { margin: 0; opacity: .92; max-width: 640px; }
  .bandeau .puces { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .bandeau .puces span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
  .carte { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 20px 20px 18px; border-radius: 14px;
    background: var(--carte); border: 1px solid var(--border); color: var(--fg); font: inherit; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .carte:hover, .carte:focus-visible { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 12px 26px rgba(91, 33, 163, .16); outline: none; }
  .carte .icone { width: 58px; height: 58px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    background: var(--teinte); color: var(--accent); margin-bottom: 8px; transition: background .15s ease, color .15s ease; }
  .carte:hover .icone, .carte:focus-visible .icone { background: var(--accent); color: var(--accent-fg); }
  .carte .icone svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .carte h2 { font-size: 18px; margin: 0; }
  .carte .accroche { font-weight: 600; color: var(--accent); font-size: 14px; }
  .carte .texte { color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
  .carte .fleche { position: absolute; top: 22px; right: 20px; color: var(--muted); transition: transform .15s ease, color .15s ease; }
  .carte:hover .fleche { transform: translateX(4px); color: var(--accent); }
  .compteurs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .compteurs span { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--teinte); color: var(--accent); font-weight: 600; }
  .compteurs span.alerte { background: var(--warn-bg); color: var(--warn); }
  .pied { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }
  @media (max-width: 640px) { .page { padding: 12px 12px 30px; } .bandeau { padding: 20px 18px; } .bandeau h1 { font-size: 22px; }
    .grille { grid-template-columns: 1fr; } #aide { top: 18px; right: 20px; } }
  @media (prefers-reduced-motion: reduce) { .carte, .carte .fleche, .carte .icone { transition: none; } .carte:hover { transform: none; } }
</style>
</head>
<body class="plein-ecran">
<div id="msg">Chargement…</div>
<div id="app" hidden>
  <div class="page">
    <a id="aide" href="tuto.html" target="_blank" rel="noopener" title="Aide de l'application">?</a>
    <section class="bandeau" id="bandeau"></section>
    <section class="grille" id="cartes" aria-label="Écrans de l'application"></section>
    <p class="pied">Rapports et suivis · inspection pédagogique régionale de mathématiques · académie d'Orléans-Tours</p>
  </div>
</div>

<script type="module">
import { $, esc, message, toast, installerBulles } from '../commun/interface.js';
import { identifierMoi } from '../commun/droits.js';
import { initialiserGrist, lireTable, sansChevauchement, regrouper, relectureReguliere, hoteEcran, detecteurChangement } from '../commun/grist.js';
import { ICONES } from '../commun/icones.js';
import { menuVisible, ajouterMonCompte, compteMenu, MENU_DEFAUT } from '../app/logique.js';
import { profil, libelleRole, cartes, compteurs, anneeScolaire } from './logique.js';

const FLECHE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
const aujourdhui = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000; };
const change = detecteurChangement();

const charger = sansChevauchement(async () => {
  const noms = ['Navigation', 'Utilisateurs', 'Personnes', 'Visites', 'Rapports', 'Stagiaires', 'Retours_PSTG', 'Types_rapport'];
  const r = await Promise.all(noms.map(lireTable));
  const T = Object.fromEntries(noms.map((n, i) => [n, r[i].lignes || []]));
  if (!change([r.map(x => x.lignes)]) && !$('app').hidden) return;
  const compte = compteMenu(T.Utilisateurs);
  const moi = compte.moi || null;
  const nav = T.Navigation.length ? T.Navigation : MENU_DEFAUT;
  const menu = ajouterMonCompte(menuVisible(nav, moi, !!compte.tous)).filter(e => e.cle !== 'accueil' && (!hoteEcran('accueil') || hoteEcran(e.cle)));
  const p = profil(moi);
  const fiche = moi ? T.Personnes.find(x => x.id === moi.Personne) : null;
  const auj = aujourdhui();
  const nb = compteurs({ visites: T.Visites, rapports: T.Rapports, stagiaires: T.Stagiaires, retours: T.Retours_PSTG, personnes: T.Personnes,
    types: T.Types_rapport }, (moi && moi.Personne) || 0, p, auj);
  $('bandeau').innerHTML = `<div class="sur">Rapports et suivis · ${esc(anneeScolaire(auj))}</div>
    <h1>Bonjour${fiche ? ' ' + esc(fiche.Prenom) : ''} !</h1>
    <p>${p === 'ipr' ? 'Le plan d\'inspection, les rapports à relire et le suivi des stagiaires et des MD, au même endroit.'
      : 'Vos visites, les emplois du temps pour les préparer, et vos rapports, de la rédaction à la signature.'}</p>
    <div class="puces">${libelleRole(moi) ? `<span>${esc(libelleRole(moi))}</span>` : ''}${nb.length ? `<span>${nb.reduce((s, x) => s + x.n, 0)} point(s) à voir</span>` : '<span>Rien en attente</span>'}</div>`;
  const liste = cartes(menu, p);
  $('cartes').innerHTML = liste.length ? liste.map(c => { const n = nb.filter(x => x.ecran === c.cle); return `
    <button class="carte" data-ecran="${esc(c.cle)}" aria-label="${esc(c.titre)} : ${esc(c.accroche)}">
      <span class="fleche">${FLECHE}</span>
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[c.cle] || ''}</svg></span>
      <h2>${esc(c.titre)}</h2>
      <span class="accroche">${esc(c.accroche)}</span>
      <span class="texte">${esc(c.texte)}</span>
      ${n.length ? `<span class="compteurs">${n.map(x => `<span class="${x.alerte ? 'alerte' : ''}">${x.n} ${esc(x.libelle)}</span>`).join('')}</span>` : ''}
    </button>`; }).join('') : '<p class="muted">Aucun écran disponible pour ce compte.</p>';
  message(''); $('app').hidden = false;
});

if (await initialiserGrist()) {
  grist.ready({ requiredAccess: 'full', allowSelectBy: false });
  grist.onRecords(regrouper(charger));
  installerBulles();
  $('cartes').addEventListener('click', e => {
    const b = e.target.closest('[data-ecran]');
    if (!b) return;
    const h = hoteEcran(b.dataset.ecran);
    if (!h) { toast('Ouvrir cet écran depuis le menu de l\'application (page Application).', true); return; }
    h.ouvrirEcran(b.dataset.ecran);
  });
  relectureReguliere(charger, () => false);
  await charger();
}
</script>
</body>
</html>
