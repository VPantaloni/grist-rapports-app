<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapports et suivis — Accueil pour Grist</title>
<link rel="icon" type="image/svg+xml" href="../commun/favicon.svg?v=2">
<link rel="stylesheet" href="../commun/style.css">
<style>
  :root { --violet-1: #5b21a3; --violet-2: #7c3aed; --violet-3: #a78bfa; --carte: var(--bg); --teinte: #f3edfc; }
  @media (prefers-color-scheme: dark) { :root { --carte: #24222d; --teinte: #2e2147; } }
  body { background: var(--bg2); }
  /* Tout tient dans la hauteur du cadre de Grist : bandeau, puis deux rangées de cartes qui se partagent le reste. */
  #app { flex: 1; min-height: 0; overflow-y: auto; }
  .page { max-width: 1240px; height: 100%; min-height: 380px; margin: 0 auto; padding: 12px 16px 14px; display: flex;
    flex-direction: column; gap: 12px; position: relative; box-sizing: border-box; }
  /* Coin du bandeau, en haut à droite : aide (?) puis, en dessous, lien vers l'application Menu (à sa couleur). */
  .coin { position: absolute; top: 20px; right: 24px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #aide { display: flex; width: 34px; height: 34px; align-items: center; justify-content: center; color: #fff; opacity: .9;
    transition: opacity .15s ease, transform .15s ease; }
  #aide:hover, #aide:focus-visible { opacity: 1; transform: scale(1.08); outline: none; }
  #aide svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #menu-apps { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: #B2B8D8; color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 3px 8px rgba(0,0,0,.18); transition: transform .15s ease; }
  #menu-apps:hover, #menu-apps:focus-visible { transform: scale(1.08); outline: none; }
  #menu-apps svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bandeau { flex: none; position: relative; overflow: hidden; min-height: 104px; box-sizing: border-box; border-radius: 14px; padding: 10px 18px 10px 12px; color: #fff;
    display: flex; align-items: center; gap: 16px;
    background: radial-gradient(120% 140% at 100% 0%, var(--violet-3) 0%, transparent 45%), linear-gradient(135deg, var(--violet-1) 0%, var(--violet-2) 100%);
    box-shadow: 0 8px 24px rgba(91, 33, 163, .22); }
  .bandeau::after { content: ''; position: absolute; right: -50px; bottom: -90px; width: 220px; height: 220px; border-radius: 50%;
    border: 30px solid rgba(255,255,255,.08); }
  .bandeau .logo { width: clamp(72px, 18vh, 116px); height: clamp(72px, 18vh, 116px); flex: none; border-radius: 16px; box-shadow: 0 0 0 3px rgba(255,255,255,.35), 0 6px 16px rgba(0,0,0,.18); }
  .bandeau .txt { min-width: 0; padding-right: 64px; }
  .bandeau h1 { font-size: clamp(22px, 4.4vh, 30px); line-height: 1.15; margin: 0; font-weight: 700; }
  .bandeau .bonjour { font-size: 14px; margin: 3px 0 0; opacity: .95; }
  .bandeau p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  .bandeau .puces { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .bandeau .puces span { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); }
  .grille { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .carte { position: relative; display: flex; flex-direction: column; gap: clamp(4px, 1.4vh, 10px); text-align: left; padding: clamp(10px, 2vh, 16px) 16px; border-radius: 14px;
    background: var(--carte); border: 1px solid var(--border); color: var(--fg); font: inherit; cursor: pointer; min-height: 0; overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .carte:hover, .carte:focus-visible { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 10px 22px rgba(91, 33, 163, .16); outline: none; }
  .carte .tete { display: flex; align-items: center; gap: 16px; padding-right: 22px; }
  .carte .icone { width: clamp(56px, 15vh, 96px); height: clamp(56px, 15vh, 96px); flex: none; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    background: var(--teinte); color: var(--accent); transition: background .15s ease, color .15s ease; }
  .carte:hover .icone, .carte:focus-visible .icone { background: var(--accent); color: var(--accent-fg); }
  .carte .icone svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .carte h2 { font-size: clamp(18px, 3.8vh, 25px); margin: 0; line-height: 1.15; }
  .carte .accroche { display: block; font-weight: 600; color: var(--accent); font-size: clamp(14px, 2.9vh, 18px); margin-top: 3px; }
  .carte .texte { color: var(--muted); font-size: 13.5px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; flex: none; }
  .compteurs { flex: none; }
  @media (max-height: 540px) { .carte .texte { -webkit-line-clamp: 2; } .bandeau p { display: none; } }
  .carte .fleche { position: absolute; top: 14px; right: 14px; color: var(--muted); transition: transform .15s ease, color .15s ease; }
  .carte:hover .fleche { transform: translateX(4px); color: var(--accent); }
  .compteurs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .compteurs span { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--teinte); color: var(--accent); font-weight: 600; }
  .compteurs span.alerte { background: var(--warn-bg); color: var(--warn); }
  @media (max-width: 760px) { .grille { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: auto; } .page { height: auto; } }
  @media (max-width: 560px) { .grille { grid-template-columns: 1fr; } .bandeau .logo { width: 56px; height: 56px; } .bandeau h1 { font-size: 21px; } }
  @media (prefers-reduced-motion: reduce) { .carte, .carte .fleche, .carte .icone { transition: none; } .carte:hover { transform: none; } }
</style>
</head>
<body class="plein-ecran">
<div id="msg">Chargement…</div>
<div id="app" hidden>
  <div class="page">
    <div class="coin">
      <a id="aide" href="tuto.html" target="_blank" rel="noopener" title="Aide de l'application" aria-label="Aide de l'application"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></a>
      <a id="menu-apps" href="https://edurl.fr/grist-app-menu" target="_blank" rel="noopener" title="Menu : toutes les applications Grist" aria-label="Ouvrir le menu des applications Grist"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></a>
    </div>
    <section class="bandeau" id="bandeau"></section>
    <section class="grille" id="cartes" aria-label="Écrans de l'application"></section>
  </div>
</div>

<script type="module">
import { $, esc, message, toast, installerBulles } from '../commun/interface.js';
import { identifierMoi } from '../commun/droits.js';
import { initialiserGrist, lireTable, sansChevauchement, regrouper, relectureReguliere, hoteEcran, detecteurChangement } from '../commun/grist.js';
import { ICONES } from '../commun/icones.js';
import { menuVisible, ajouterMonCompte, compteMenu, MENU_DEFAUT } from '../app/logique.js';
import { profil, libelleRole, cartes, compteurs, anneeScolaire } from './logique.js';

const FLECHE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
const aujourdhui = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000; };
const change = detecteurChangement();

const charger = sansChevauchement(async () => {
  const noms = ['Navigation', 'Utilisateurs', 'Personnes', 'Visites', 'Rapports', 'Stagiaires', 'Retours_PSTG', 'Types_rapport'];
  const r = await Promise.all(noms.map(lireTable));
  const T = Object.fromEntries(noms.map((n, i) => [n, r[i].lignes || []]));
  if (!change([r.map(x => x.lignes)]) && !$('app').hidden) return;
  const compte = compteMenu(T.Utilisateurs);
  const moi = compte.moi || null;
  const nav = T.Navigation.length ? T.Navigation : MENU_DEFAUT;
  const menu = ajouterMonCompte(menuVisible(nav, moi, !!compte.tous)).filter(e => e.cle !== 'accueil' && (!hoteEcran('accueil') || hoteEcran(e.cle)));
  const p = profil(moi);
  const fiche = moi ? T.Personnes.find(x => x.id === moi.Personne) : null;
  const auj = aujourdhui();
  const nb = compteurs({ visites: T.Visites, rapports: T.Rapports, stagiaires: T.Stagiaires, retours: T.Retours_PSTG, personnes: T.Personnes,
    types: T.Types_rapport }, (moi && moi.Personne) || 0, p, auj);
  const total = nb.reduce((t, x) => t + x.n, 0);
  $('bandeau').innerHTML = `<img class="logo" src="../commun/favicon.svg?v=2" alt="">
    <div class="txt"><h1>Rapports et suivis · ${esc(anneeScolaire(auj))}</h1>
    <div class="bonjour">Bonjour${fiche ? ' ' + esc(fiche.Prenom) : ''} !</div>
    <p>${p === 'ipr' ? 'Le plan d\'inspection, les rapports à relire et le suivi des stagiaires et des MD, au même endroit.'
      : 'Vos visites, les emplois du temps pour les préparer, et vos rapports, de la rédaction à la signature.'}</p>
    <div class="puces">${libelleRole(moi) ? `<span>${esc(libelleRole(moi))}</span>` : ''}<span>${total ? `${total} point${total > 1 ? 's' : ''} à voir` : 'Rien en attente'}</span></div></div>`;
  const liste = cartes(menu, p).slice(0, 6);
  $('cartes').innerHTML = liste.length ? liste.map(c => { const n = nb.filter(x => x.ecran === c.cle); return `
    <button class="carte" data-ecran="${esc(c.cle)}" aria-label="${esc(c.titre)} : ${esc(c.accroche)}">
      <span class="fleche">${FLECHE}</span>
      <span class="tete"><span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[c.cle] || ''}</svg></span>
        <span><h2>${esc(c.titre)}</h2><span class="accroche">${esc(c.accroche)}</span></span></span>
      <span class="texte">${esc(c.texte)}</span>
      ${n.length ? `<span class="compteurs">${n.map(x => `<span class="${x.alerte ? 'alerte' : ''}">${x.n} ${esc(x.libelle)}</span>`).join('')}</span>` : ''}
    </button>`; }).join('') : '<p class="muted">Aucun écran disponible pour ce compte.</p>';
  message(''); $('app').hidden = false;
});

if (await initialiserGrist()) {
  grist.ready({ requiredAccess: 'full', allowSelectBy: false });
  grist.onRecords(regrouper(charger));
  installerBulles();
  $('cartes').addEventListener('click', e => {
    const b = e.target.closest('[data-ecran]');
    if (!b) return;
    const h = hoteEcran(b.dataset.ecran);
    if (!h) { toast('Ouvrir cet écran depuis le menu de l\'application (page Application).', true); return; }
    h.ouvrirEcran(b.dataset.ecran);
  });
  relectureReguliere(charger, () => false);
  await charger();
}
</script>
</body>
</html>
