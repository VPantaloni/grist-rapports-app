<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapports et suivis — Rapports pour Grist</title>
<link rel="icon" type="image/svg+xml" href="../commun/favicon.svg?v=2">
<link rel="stylesheet" href="../commun/style.css">
<style>
  #app { flex: 1; display: flex; min-height: 0; }

  /* Liste */
  #menu { width: 300px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .outils { padding: 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); }
  .outils .ligne { display: flex; gap: 6px; }
  .outils input, .outils select { flex: 1; min-width: 0; }
  #liste { flex: 1; overflow-y: auto; }
  /* Liste repliable : repliée d'office à l'ouverture ou à la création d'un rapport */
  #menu .bande { display: none; }
  #menu.replie { width: 38px; }
  #menu.replie .outils, #menu.replie #liste { display: none; }
  #menu.replie .bande { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; height: 100%; }
  #menu .bande button { width: 28px; padding: 3px 0; }
  #menu .bande .vertical { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
  .outils .tete { display: flex; gap: 6px; } .outils .tete .primary { flex: 1; }
  .groupe > button { width: 100%; text-align: left; border: none; border-radius: 0; background: var(--bg2);
    border-bottom: 1px solid var(--border); border-left: 4px solid var(--border); font-weight: 600; padding: 6px 8px; }
  .groupe > button .nb { color: var(--muted); font-weight: normal; }
  .groupe ul { list-style: none; margin: 0; padding: 0; }
  .groupe li { padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 3px solid transparent; }
  .groupe li:hover { background: var(--bg2); }
  .groupe li.sel { background: var(--sel); border-left-color: var(--accent); }
  .groupe li .nom { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .groupe li .det { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-Brouillon > button { border-left-color: #9ca3af; } .g-Soumis > button { border-left-color: var(--info); }
  .g-Areprendre > button { border-left-color: var(--warn); } .g-Valide > button { border-left-color: var(--accent); }
  .g-Transmis > button { border-left-color: var(--accent); }

  /* Fiche */
  #zone { flex: 1; display: flex; min-width: 0; min-height: 0; }
  #fiche { flex: 1; overflow-y: auto; padding: 12px 16px 40px; min-width: 0; }
  #phrases { width: 300px; flex: none; border-left: 1px solid var(--border); overflow-y: auto; padding: 10px; background: var(--bg2); }
  #aide { position: absolute; top: 6px; right: 8px; z-index: 5; border-radius: 50%; width: 28px; height: 28px; padding: 0;
    display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--fg); background: var(--bg2);
    border: 1px solid var(--border); }
  #aide:hover { border-color: var(--accent); color: var(--accent); }
  .entete { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin: 0 36px 10px 0; }
  .entete h1 { font-size: 19px; margin: 0; flex: 1; min-width: 220px; }
  .entete .sous { display: block; font-size: 13px; font-weight: normal; color: var(--muted); margin-top: 2px; }
  .statut { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--border); white-space: nowrap; }
  .bloc { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .bloc h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 10px; }
  .grille .large { grid-column: 1 / -1; }
  .onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 6px 0 10px; }
  .onglets button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; }
  .onglets button.actif { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  .rubrique { margin-bottom: 14px; }
  .rubrique h3 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  .rubrique h3 .forme { font-size: 11px; font-weight: normal; color: var(--muted); }
  .rubrique details.consigne { margin: 0 0 4px; font-size: 12px; }
  .rubrique details.consigne p { margin: 4px 0 0; padding: 6px 8px; border-left: 3px solid var(--danger); background: var(--danger-bg); white-space: pre-wrap; }
  .rubrique textarea { width: 100%; min-height: 90px; }
  .rubrique .lu { white-space: pre-wrap; padding: 6px 8px; border: 1px dashed var(--border); border-radius: 4px; min-height: 28px; }
  .commentaire { margin-top: 4px; padding: 6px 8px; border-left: 3px solid var(--warn); background: var(--warn-bg); font-size: 13px; white-space: pre-wrap; }
  .commentaire textarea { width: 100%; min-height: 50px; margin-top: 4px; }
  /* Relecture : ajouts (bleu, soulignés), suppressions (rouge, barrées), commentaires (orange), traités (gris). */
  ins { background: color-mix(in srgb, var(--info) 22%, transparent); color: inherit; text-decoration: underline; text-decoration-color: var(--info); text-underline-offset: 2px; }
  del { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); text-decoration: line-through; }
  .suggestion { margin-top: 4px; padding: 6px 8px; border-left: 3px solid var(--info); background: color-mix(in srgb, var(--info) 7%, transparent); font-size: 13px; }
  .suggestion .titre, .commentaire .titre { font-weight: 600; font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .suggestion .titre button, .commentaire .titre button { font-size: 12px; padding: 1px 8px; }
  .diff { white-space: pre-wrap; margin-top: 3px; }
  .commentaire.traite { border-left-color: var(--muted); background: var(--bg2); color: var(--muted); }
  /* En-tête repliable (bandeau) */
  details.entete-bloc > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  details.entete-bloc > summary::-webkit-details-marker { display: none; }
  details.entete-bloc > summary::before { content: '▸'; color: var(--muted); } details.entete-bloc[open] > summary::before { content: '▾'; }
  details.entete-bloc > summary .resume { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  details.entete-bloc[open] > summary .resume { display: none; }
  details.entete-bloc[open] > summary { margin-bottom: 8px; }
  details.entete-bloc:not([open]) { padding: 6px 12px; }
  /* Aperçu : hauteur de la fenêtre ; plein écran */
  .apercu-outils { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 12px; }
  .apercu-outils .aide { color: var(--muted); flex: 1; min-width: 200px; }
  .apercu-outils select { width: auto; }
  #apercu { width: 100%; height: 70vh; border: 1px solid var(--border); border-radius: 6px; background: #fff; display: block; }
  .cadre-apercu.plein { position: fixed; inset: 0; z-index: 40; background: var(--bg); padding: 8px 12px; display: flex; flex-direction: column; }
  .cadre-apercu.plein #apercu { flex: 1; height: auto !important; }
  /* Commentaires ancrés (Rédaction) */
  .notes-red .note { margin-top: 4px; padding: 5px 8px; border-left: 3px solid var(--warn); background: var(--warn-bg); font-size: 13px; }
  .notes-red .note.ok { border-left-color: var(--muted); background: var(--bg2); color: var(--muted); }
  .notes-red .q { font-style: italic; } .notes-red .perdu { color: var(--danger); font-size: 12px; }
  .notes-red button { font-size: 12px; padding: 1px 8px; margin-left: 4px; }
  .outils-rel { display: flex; justify-content: flex-end; margin-top: 2px; } .outils-rel button { font-size: 12px; padding: 1px 8px; }
  #note-q { margin: 6px 0; padding: 6px 8px; border-left: 3px solid var(--warn); background: var(--warn-bg); font-style: italic; max-height: 120px; overflow: auto; white-space: pre-wrap; }
  #note-c { width: 100%; }
  .legende { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; }
  .legende .c { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 0 6px; }
  .barre { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 8px 0; display: flex;
    gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .barre .etat { margin-left: auto; font-size: 12px; color: var(--muted); }
  .resultats { max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; margin: 4px 0 10px; }
  .resultats div[data-uai], .resultats div[data-prof] { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .resultats div:hover { background: var(--sel); }
  .resultats .titre { padding: 4px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; background: var(--bg2); }
  .puce { display: inline-flex; gap: 6px; align-items: center; padding: 2px 4px 2px 10px; border-radius: 12px; background: var(--sel); margin-bottom: 6px; }
  .puce button { border: none; background: none; padding: 0 6px; }
  .phrase { padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px;
    cursor: pointer; font-size: 13px; line-height: 1.35; }
  .phrase:hover { border-color: var(--accent); }
  .phrase .meta { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
  #phrases h2 { font-size: 13px; margin: 0 0 6px; }
  #phrases .filtres { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  #phrases .filtres button { padding: 1px 7px; font-size: 12px; }
  #phrases .filtres button.actif { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .md .niveaux { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px; }
  .md .niveau { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .md .niveau.choisi { border-color: var(--accent); background: var(--sel); }
  .md .niveau[style*="--niv"] { border-left: 5px solid var(--niv); }
  .md .niveau.choisi[style*="--niv"] { border-color: var(--niv); border-left-width: 5px; background: color-mix(in srgb, var(--niv) 16%, transparent); }
  .md .niveaux.compact { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
  .echelle { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin: 6px 0 10px; }
  .pastille { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; border: 1px solid rgba(0,0,0,.15); }
  .phrase[style*="--niv"] { border-left: 4px solid var(--niv); }
  .signature img { max-width: 260px; max-height: 100px; background: #fff; border: 1px solid var(--border); border-radius: 4px; }

  dialog { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; max-width: 520px; width: calc(100% - 32px);
    background: var(--bg); color: var(--fg); }
  dialog::backdrop { background: rgba(0, 0, 0, .35); }
  dialog h2 { font-size: 16px; margin: 0 0 8px; }
  #collage { border: 2px dashed var(--border); border-radius: 6px; padding: 14px; text-align: center; color: var(--muted); margin: 8px 0; outline: none; }
  #collage:focus { border-color: var(--accent); }
  #collage img { max-width: 100%; max-height: 140px; background: #fff; }

  @media (max-width: 900px) { #phrases { display: none; } }
  @media (max-width: 640px) {
    #menu.replie { width: auto; } #menu.replie .bande { flex-direction: row; height: auto; padding: 4px 8px; }
    #menu .bande .vertical { writing-mode: horizontal-tb; transform: none; }
    body.plein-ecran { overflow: auto; height: auto; }
    #app, #zone { flex-direction: column; }
    #menu { width: auto; border-right: none; border-bottom: 1px solid var(--border); }
    #liste { max-height: 40vh; }
    #fiche { overflow: visible; }
  }
</style>
</head>
<body class="plein-ecran">
<div id="msg">Chargement…</div>
<div id="app" hidden>
  <aside id="menu">
    <div class="bande">
      <button id="deplier" title="Afficher la liste des rapports">»</button>
      <button id="nouveau-bande" class="primary" title="Créer un rapport">+</button>
      <span class="vertical" id="deplier-texte" title="Afficher la liste des rapports">Liste des rapports</span>
    </div>
    <div class="outils">
      <div class="tete"><button id="nouveau" class="primary">+ Nouveau rapport</button><button id="replier" title="Replier la liste : plus de place pour le rapport">«</button></div>
      <button id="importer" hidden title="IA-IPR : coller le texte d'un ancien rapport (Word, PDF) pour le verser dans l'application, déjà transmis">⤓ Importer un ancien rapport</button>
      <div class="ligne">
        <input id="recherche" type="search" placeholder="Filtrer les rapports existants…" title="Filtre la liste des rapports déjà créés (professeur·e, établissement, thème). Pour en créer un : + Nouveau rapport">
        <button id="recharger" title="Relire les tables">↻</button>
      </div>
      <select id="filtre" title="Rapports affichés">
        <option value="">Tous les rapports</option><option value="miens">Mes rapports</option><option value="a-valider">À valider (IA-IPR)</option>
      </select>
    </div>
    <div id="liste"></div>
  </aside>
  <div id="zone" style="position:relative">
    <a id="aide" href="tuto.html" target="_blank" rel="noopener" title="Aide : mode d'emploi de l'écran Rapports">?</a>
    <main id="fiche"></main>
    <aside id="phrases" hidden></aside>
  </div>
</div>

<dialog id="dlg-note" aria-labelledby="note-titre">
  <h2 id="note-titre">Commenter le passage</h2>
  <div id="note-q"></div>
  <textarea id="note-c" rows="4" placeholder="Commentaire, visible du ou de la CMi"></textarea>
  <div class="actions"><button id="note-ok" class="primary">Enregistrer</button><button id="note-annuler">Annuler</button></div>
</dialog>
<dialog id="dlg-maphrase" aria-labelledby="mp-titre">
  <h2 id="mp-titre">Ajouter à mes phrases</h2>
  <div id="mp-corps"></div>
  <div class="actions"><button id="mp-ok" class="primary">Ajouter</button><button id="mp-annuler">Annuler</button></div>
</dialog>
<dialog id="dlg-signature" aria-labelledby="sig-titre">
  <h2 id="sig-titre">Signer</h2>
  <div id="sig-corps"></div>
  <div class="actions"><button id="sig-ok" class="primary">Signer</button><button id="sig-annuler">Annuler</button></div>
</dialog>

<script type="module">
import { actionsRapportSupprime } from '../plan/logique.js';
import { liste, nomFiche, norm } from '../commun/donnees.js';
import { identifierMoi, droitsTable } from '../commun/droits.js';
import { $, esc, message, toast, installerBulles, preferences, boutonConfirmation } from '../commun/interface.js';
import { initialiserGrist, lireTable, ecrire, sansChevauchement, regrouper, relectureReguliere, relireSansCache, detecteurChangement,
  demandeConteneur } from '../commun/grist.js';
import { CHIFFREMENT } from '../commun/config.js';
import { TABLE_CHIFFREMENT, ligneChiffrementValide, lignesLisibles, tableChiffree, chiffrerActions, cleAuDemarrage, suivreCle } from '../commun/chiffrement.js';
import { TABLE, STATUTS, typePropose, pstgHorsListe, statutAffiche, dateFr, dateIso, isoVersGrist, aujourdhuiGrist, nomFichierPdf,
  redigeParIpr, peutValiderSeul, descripteurs, rubriquesDuType, structureDe, lireStructure, lireObjet, lireListe, contenuInitial, remplirChamps, generaliserPhrase, competenceDuPassage, rubriquesVides, phrasesPour, inserer,
  rechercher, grouperRapports, peutCreer, peutRediger, peutSoumettre, peutRelire, peutTransmettre, peutSupprimer, estAdmin,
  ajouterHistorique, destinataires, remplirMail, lienMailto, tailleSignature, visiteAssociee, MAILS_RELECTURE, mailsRelecture, lienEchange,
  lirePositionnement, positionner, grillePour, echellePour, couleurNiveau, rangsPositionnement, ongletParDefaut, lireRelecture, suggerer, commenter, trancher, traiter, appliquerSuggestions, bilanRelecture, peutRepondre, annoter, changerNote, occurrence, vueRelue,
  diffMots, peutImporter } from './logique.js';
import { lireCollage, lireNomPrenom, lireEtab, lireDate, typeImporte, repartir, contenuImporte, trouverPersonne, candidatsProf, validerImport } from './import.js';
import { htmlImpression, htmlPositionnement } from './impression.js';

const pref = preferences('Rapports');

// --- État ---
const D = { rapports: [], types: [], rubriques: [], phrases: [], personnes: [], profs: [], etabs: [], params: {}, competences: [], signatures: [], visites: [] };
let moi = null, droits = droitsTable(null, TABLE);
let sel = Number(pref.lire('Sel', '0')) || 0;
let importation = null;  // ancien rapport collé : { etape: 'coller' | 'verifier', texte, f (champs), blocs, codes, alertes }
let creation = null;     // { q, uai, prof, typeCode, date, heure, classe, effectif, theme, valideur, auteur, visite }
let onglet = 'redaction';
let enteteOuvert = pref.lire('Entete', '0') === '1';            // bandeau d'en-tête déplié
let zoomApercu = Number(pref.lire('Zoom', '100')) || 100;        // zoom de l'aperçu (%)
let pleinEcran = false, scrollApercu = 0;                        // aperçu sur tout l'écran ; position de lecture gardée
let rubriqueActive = '', competenceFiltre = '', champActif = null, tousNiveaux = false;
let brouillon = null;    // saisie en cours du rapport affiché : { id, champs }, envoyée ≈ 1 s après la dernière frappe
let minuterie = null, envoiEnCours = false;
// Chiffrement (SPEC § 5.8) : sans la clé, contenu vide et aucune écriture dans Rapports.
let cle = null, cleLue = false;
const cacheChiffre = new Map();
const masque = () => tableChiffree(CHIFFREMENT, TABLE) && !cle;
const TIP_MASQUE = 'Contenu chiffré masqué : « Révéler » (menu de l\'application) pour lire et écrire';

let ouverts = new Set();
try { ouverts = new Set(JSON.parse(pref.lire('Ouverts', '["Brouillon","Soumis","À reprendre"]'))); } catch (e) { /* préférence illisible */ }

const personne = id => D.personnes.find(x => x.id === id);
const nomPers = id => { const p = personne(id); return p ? nomFiche(p) : ''; };
const typeDe = r => D.types.find(t => t.id === r.Type) || {};
const moiPers = () => (moi && moi.Personne) || 0;
const initialesMoi = () => { const p = personne(moiPers()); return (p && p.Initiales) || ''; };
const rapportSel = () => D.rapports.find(r => r.id === sel);
function choisir(id) { if (id !== sel) scrollApercu = 0; sel = id; pref.ecrire('Sel', String(id)); }
// Liste de gauche : repliée dès qu'on ouvre ou crée un rapport ; « » » la déplie.
function replier(oui) { $('menu').classList.toggle('replie', oui); }
// Onglet ouvert d'office pour un rapport : Positionnement d'abord (PSTG, MD) tant qu'il n'est pas complet.
function ongletDe(id) { const r = D.rapports.find(x => x.id === id); return r ? ongletParDefaut(typeDe(r), D.competences, r.Positionnement) : 'redaction'; }

// --- Écriture (chiffrée) ---
async function ecrireRapport(actions, ok) {
  if (masque()) { toast(TIP_MASQUE + '.', true); return null; }
  const res = await ecrire(await chiffrerActions(cle, actions, CHIFFREMENT), ok);
  if (res) await charger();
  return res;
}
// Saisie : champs regroupés, envoyés après une pause ; Ctrl/Cmd + S tout de suite.
function noter(id, champs) {
  if (!brouillon || brouillon.id !== id) brouillon = { id, champs: {} };
  Object.assign(brouillon.champs, champs);
  etatSaisie('Modifications non enregistrées…');
  clearTimeout(minuterie);
  minuterie = setTimeout(envoyer, 1000);
}
async function envoyer() {
  clearTimeout(minuterie);
  if (!brouillon || envoiEnCours) return;
  if (masque()) { etatSaisie('En attente de « Révéler » pour enregistrer'); return; }
  const { id, champs } = brouillon;
  brouillon = null; envoiEnCours = true;
  try {
    const res = await ecrire(await chiffrerActions(cle, [['UpdateRecord', TABLE, id, champs]], CHIFFREMENT));
    if (res) { const r = D.rapports.find(x => x.id === id); if (r) Object.assign(r, champs); etatSaisie('Enregistré'); }
    else etatSaisie('Échec de l\'enregistrement');
  } finally { envoiEnCours = false; }
  if (brouillon) minuterie = setTimeout(envoyer, 300);
}
const etatSaisie = t => { const e = $('etat-saisie'); if (e) e.textContent = t; };

// --- Liste ---
function afficherListe() {
  const groupes = grouperRapports(D.rapports, { recherche: $('recherche').value, filtre: $('filtre').value, moi: moiPers() });
  const cherche = !!$('recherche').value.trim();
  const r = rapportSel();
  if (r) ouverts.add(r.Statut);
  $('liste').innerHTML = groupes.length ? groupes.map(g => {
    const ferme = !cherche && !ouverts.has(g.cle);
    return `<div class="groupe g-${esc(g.cle.normalize('NFD').replace(/[^A-Za-z]/g, ''))}">
      <button type="button" data-groupe="${esc(g.cle)}">${ferme ? '▸' : '▾'} ${esc(g.titre)} <span class="nb">(${g.rapports.length})</span></button>
      <ul ${ferme ? 'hidden' : ''}>${g.rapports.map(x => `<li data-id="${x.id}" class="${x.id === sel ? 'sel' : ''}">
        <span class="nom">${esc([x.Prof_nom, x.Prof_prenom].filter(Boolean).join(' ') || 'Sans nom')}</span>
        <span class="det">${esc(dateFr(x.Date_visite))} · ${esc(typeDe(x).Code || '')} · ${esc(x.Etab_nom || '')} · ${esc((personne(x.Auteur) || {}).Initiales || '')}</span></li>`).join('')}</ul></div>`;
  }).join('') : '<p class="vide">Aucun rapport.</p>';
  // Toujours visible : inactif, il dit pourquoi (info-bulle, et message au clic).
  const pb = pourquoiPasCreer();
  $('importer').hidden = !peutImporter(droits, moi);
  $('nouveau').classList.toggle('inactif', !!pb);
  $('nouveau').title = pb || 'Créer un rapport';
}

// Pourquoi ne puis-je pas créer de rapport ? '' = je peux.
function pourquoiPasCreer() {
  if (!moi) return 'Compte non reconnu : ton e-mail Grist doit figurer, actif, dans la table Utilisateurs (Administration → Mon compte pour vérifier)';
  if (!peutCreer(droits, moi)) return droits.C === 'Limité'
    ? 'Ton compte n\'est relié à aucune fiche de l\'annuaire : renseigner la colonne Personne de ta ligne Utilisateurs'
    : 'Ton rôle ne permet pas de créer de rapport (matrice Permissions, table Rapports, colonne Créer)';
  if (masque()) return TIP_MASQUE;
  if (!D.profs.length) return 'Aucun·e professeur·e : importer le fichier académique (Administration → Import)';
  if (!moiPers() && !D.personnes.some(x => x.Fonction === 'CMi')) return 'Aucune fiche CMi dans la table Personnes, et ton compte n\'est relié à aucune fiche : ajouter les fiches (CMi, IA-IPR) puis relier ta ligne Utilisateurs';
  return '';
}

async function creer() {
  const c = creation, p = D.profs.find(x => x.id === c.prof), t = D.types.find(x => x.Code === c.typeCode);
  const auteur = estAdmin(moi) && c.auteur ? c.auteur : moiPers() || c.auteur;
  const erreurs = [];
  if (!t) erreurs.push('Type de rapport à choisir.');
  if (!isoVersGrist(c.date)) erreurs.push('Date de la visite à indiquer.');
  if (!auteur) erreurs.push('CMi (auteur·e) à choisir.');
  if (c.effectif && !/^\d+$/.test(c.effectif.trim())) erreurs.push('Effectif : un nombre entier.');
  $('c-erreurs').innerHTML = erreurs.map(e => `<li>${esc(e)}</li>`).join('');
  if (erreurs.length) return;
  const etab = D.etabs.find(e => e.UAI === p.UAI) || {};
  const rub = rubriquesDuType(D.rubriques, t.id);
  // Plan d'inspection : visite à relier (demandée depuis le plan, sinon celle prévue pour ce·tte professeur·e) ; si elle
  // n'a pas de date calée, la date du rapport y est posée (notée dans l'historique : effacée si le rapport est supprimé).
  const vPlan = visiteAssociee(D.visites, { visite: c.visite, prof: p.id, auteur });
  const datePosee = !!(vPlan && !vPlan.Date_prevue);
  const champs = {
    Type: t.id, Professeur: p.id, Prof_civilite: p.Civilite || '', Prof_nom: p.Nom || '', Prof_prenom: p.Prenom || '',
    Prof_statut: statutAffiche(p), Stagiaire_hors_liste: pstgHorsListe(t.Code, p), UAI: p.UAI || '', Etab_nom: etab.Nom || '',
    Etab_commune: etab.Commune || '', Date_visite: isoVersGrist(c.date), Heure: c.heure.trim(), Classe: c.classe.trim(),
    Effectif: c.effectif.trim() ? Number(c.effectif) : null, Theme: c.theme.trim(),
    Contenu: JSON.stringify(contenuInitial(rub, { civilite: p.Civilite, nom: p.Nom, prenom: p.Prenom })),
    Structure: JSON.stringify(structureDe(rub)), Positionnement: '', Commentaires: '', Statut: 'Brouillon',
    Auteur: auteur, Valideur: (personne(auteur) || {}).Fonction === 'IA-IPR' ? auteur : c.valideur || 0,
    Historique: ajouterHistorique('[]', initialesMoi() || (moi && moi.Email) || '', 'créé' + (pstgHorsListe(t.Code, p) ? ' ; PSTG hors liste' : '') + (datePosee ? ' ; date calée au plan' : '')),
  };
  const res = await ecrireRapport([['AddRecord', TABLE, null, champs]], 'Rapport créé');
  if (!res) return;
  const id = res.retValues && res.retValues[0];
  const v = id ? vPlan : null;
  if (v) await ecrire([['UpdateRecord', 'Visites', v.id, { Rapport: id, ...(datePosee ? { Date_prevue: champs.Date_visite } : {}) }]], 'Visite du plan reliée');
  creation = null; onglet = id ? ongletDe(id) : 'redaction';
  if (id) { choisir(id); replier(true); }
  afficherListe(); afficherFiche();
}

function analyserImport() {

  const typeCode = typeImporte(c.statut || '', i.texte);

  const cands = candidatsProf({ nom: np.nom, prenom: np.prenom, uai: uai || (etab && etab.UAI) || '' }, D.profs);
  i.f = { typeCode, civilite: np.civilite || c.civilite || '', nom: np.nom, prenom: np.prenom,
    statut: [c.statut, c.echelon ? `échelon ${c.echelon}` : ''].filter(Boolean).join(' · '),
    prof: cands.length === 1 ? cands[0].id : 0, uai: uai || (etab && etab.UAI) || '', etabNom: (etab && etab.Nom) || et.nom, commune: (etab && etab.Commune) || et.commune,
    date: lireDate(c.date || ''), heure: c.heure || '', classe: c.classe || '', effectif: (c.effectif || '').replace(/\D/g, ''), theme: c.theme || '',
    cmi: cmi ? cmi.id : 0, ipr: ipr ? ipr.id : (personne(moiPers()) && personne(moiPers()).Fonction === 'IA-IPR' ? moiPers() : 0),
    cmiLu: c.cmi || '', iprLu: c.ipr || '' };
  i.blocs = l.blocs;
  i.alertes = [...l.alertes,
    ...(c.cmi && !cmi ? [`CMi « ${c.cmi} » absent·e de l'annuaire : la créer dans l'Annuaire, ou choisir « aucun·e ».`] : []),

    ...(cands.length > 1 ? [`${cands.length} professeur·es du fichier portent ce nom : choisir le bon lien (ou aucun).`] : [])];
  i.codes = repartir(i.blocs, rubriquesImport(typeCode));
  i.etape = 'verifier';
}

    Stagiaire_hors_liste: false, UAI: f.uai.toUpperCase(), Etab_nom: f.etabNom, Etab_commune: f.commune, Date_visite: isoVersGrist(f.date),
    Heure: f.heure, Classe: f.classe, Effectif: f.effectif ? Number(f.effectif) : null, Theme: f.theme,
    Contenu: JSON.stringify(contenuImporte(i.blocs, i.codes, rub)), Structure: JSON.stringify(rub), Positionnement: '', Commentaires: '',
    Statut: 'Transmis', Auteur: f.cmi || f.ipr, Valideur: f.ipr, Importe: true,
    Historique: ajouterHistorique('[]', initialesMoi() || (moi && moi.Email) || '', 'ancien rapport importé (copier-coller), transmis d\'office'),
  };
  const res = await ecrireRapport([['AddRecord', TABLE, null, champs]], 'Ancien rapport importé');
  if (!res) return;
  const id = res.retValues && res.retValues[0];
  importation = null;
  if (id) { choisir(id); onglet = 'apercu'; replier(true); }
  afficherListe(); afficherFiche();
}

// --- Fiche ---
// Relecture : texte du rapport → suggestion, mot à mot (ajouts <ins>, suppressions <del>).
function htmlDiff(a, b) {
  return diffMots(a, b).map(x => x.t === '=' ? esc(x.x) : x.t === '+' ? `<ins>${esc(x.x)}</ins>` : `<del>${esc(x.x)}</del>`).join('');
}
function legendeRelecture(b, relit, repond) {
  if (!relit && !b.suggestions && !b.commentaires && !b.traites) return '';
  const etat = [b.suggestions ? `${b.suggestions} suggestion${b.suggestions > 1 ? 's' : ''} en attente` : '',
    b.commentaires ? `${b.commentaires} commentaire${b.commentaires > 1 ? 's' : ''} à traiter` : '', b.traites ? `${b.traites} traité${b.traites > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');
  return `<div class="legende"><strong>Relecture</strong><ins>texte ajouté</ins><del>texte retiré</del><span class="c">commentaire</span>
    <span class="muted">${esc(etat || 'aucune suggestion pour l\'instant')}${relit ? ' — vos modifications restent des suggestions ; elles s\'appliquent si vous validez' : repond && b.suggestions ? ' — accepter ou refuser chaque suggestion' : ''}</span></div>`;
}

// Onglet Positionnement : grille du type (MD : 3 compétences, niveau et phrase ; PSTG : P1-P5 sur 4 niveaux colorés).
function corpsPositionnement(r, t, redige) {
  const echelle = echellePour(t, D.params), niveaux = echelle.map(e => e.cle);
  const p = lirePositionnement(r.Positionnement);
  const comps = grillePour(t, D.competences);
  const md = String(t.Code || '').toUpperCase() === 'MD';
  const couleur = n => couleurNiveau(niveaux.indexOf(n) + 1, niveaux.length);
  const avecPhrase = k => md || String(k.Phrases_types || '').trim() || (p[k.Code] && p[k.Code].phrase);
  const decrits = echelle.some(e => e.desc);
  return `<p class="muted">${md ? 'Positionnement du ou de la maître·sse délégué·e : pour chaque compétence, un niveau et une phrase.'
      : 'Positionnement sur chaque compétence ; les phrases types proposées pour une compétence suivent son niveau (les autres restent accessibles).'}
      Enregistré avec le rapport, <strong>jamais imprimé dans le rapport</strong>.</p>
    ${md && D.params.aide_md ? `<div class="alerte petit">${esc(D.params.aide_md)}</div>` : ''}
    ${decrits ? `<div class="echelle">${echelle.map(e => `<span><span class="pastille" style="background:${couleur(e.cle)}"></span><strong>${esc(e.cle)}</strong> : ${esc(e.desc)}</span>`).join('')}</div>` : ''}
    ${!comps.length ? `<div class="alerte">Aucune compétence pour le type ${esc(t.Code || '')} : Modèles &amp; phrases → Grilles de positionnement (colonne « Types de rapport »).</div>` : ''}
    ${md && comps.length > 3 ? `<div class="alerte petit">La grille compte ${comps.length} compétences : Modèles &amp; phrases → Grilles de positionnement pour ne garder que les trois du positionnement.</div>` : ''}
    ${comps.map(k => { const d = descripteurs(k.Descripteurs, niveaux), x = p[k.Code] || { niveau: '', phrase: '' };
      return `<div class="bloc md"><h3 style="font-size:14px;margin:0 0 6px">${md ? '' : `${esc(k.Code)} · `}${esc(k.Libelle)}</h3>
      <div class="niveaux ${Object.keys(d).length ? '' : 'compact'}">${niveaux.map(n => `<label class="niveau ${x.niveau === n ? 'choisi' : ''}" style="--niv:${couleur(n)}" title="${esc((echelle.find(e => e.cle === n) || {}).desc || '')}"><span><input type="radio" name="md-${esc(k.Code)}"
        data-md="${esc(k.Code)}" value="${esc(n)}" ${x.niveau === n ? 'checked' : ''} ${redige ? '' : 'disabled'}> <strong>${esc(n)}</strong></span>
        ${d[n] ? `<span class="petit">${esc(d[n])}</span>` : ''}</label>`).join('')}</div>
      ${avecPhrase(k) ? `<label class="champ" style="margin-top:6px"><span>Phrase${redige ? ' (proposée selon le niveau, modifiable)' : ''}</span>${redige
        ? `<textarea data-md-phrase="${esc(k.Code)}" rows="2" placeholder="Choisir un niveau : une phrase d'illustration est proposée">${esc(x.phrase)}</textarea>`
        : `<div>${esc(x.phrase) || '<span class="muted">—</span>'}</div>`}</label>` : ''}</div>`; }).join('')}
    <div class="actions"><button id="imprimer-md">Imprimer le positionnement</button></div>`;
}
function corpsHistorique(r) {
  const h = lireListe(r.Historique);
  return h.length ? `<table><tr><th>Date</th><th>Qui</th><th>Action</th></tr>${h.map(x => `<tr><td>${esc(x.date)}</td><td>${esc(x.qui)}</td><td>${esc(x.action)}</td></tr>`).join('')}</table>`
    : '<p class="muted">Aucun historique.</p>';
}

function boutons(r) {
  const b = [];
  const inactif = masque() ? ` class="inactif" title="${esc(TIP_MASQUE)}"` : '';
  const parIpr = redigeParIpr(r, D.personnes);
  if (peutValiderSeul(droits, moi, r, parIpr)) b.push(`<button id="b-valider" class="primary${masque() ? ' inactif' : ''}" title="Rapport rédigé seul·e : poser ma signature et valider (pas de relecture)">Signer et valider</button>`);
  if (peutSoumettre(droits, moi, r, parIpr)) b.push(`<button id="b-soumettre" class="primary${masque() ? ' inactif' : ''}" title="Poser ma signature et envoyer le rapport à l'IA-IPR pour relecture">Signer et soumettre</button>`);
  if (!parIpr && peutRelire(droits, moi, r)) {
    b.push(`<button id="b-valider" class="primary${masque() ? ' inactif' : ''}" title="Poser ma signature et valider le rapport">Signer et valider</button>`);
    b.push(`<button id="b-renvoyer"${inactif} title="Renvoyer au ou à la CMi avec les commentaires (double clic)">Renvoyer à reprendre</button>`);
  }
  for (const k of mailsRelecture(droits, moi, r, parIpr)) {
    const m = MAILS_RELECTURE[k];
    b.push(`<button data-echange="${k}" title="Ouvrir la messagerie vers ${m.vers === 'ipr' ? 'l\'IA-IPR' : 'le ou la CMi'} (texte prêt, modifiable avant l'envoi)">${esc(m.bouton)}</button>`);
  }
  b.push(`<button id="b-imprimer"${inactif || ' title="Ouvrir le rapport mis en page dans un nouvel onglet, puis Ctrl/Cmd + P → PDF"'}>Imprimer / PDF</button>`);
  if (peutTransmettre(droits, moi, r)) {
    b.push(`<button id="b-mail" title="Ouvrir la messagerie : secrétariat, copies ; joindre le PDF enregistré">✉ Préparer le mail</button>`);
    b.push(`<button id="b-transmis"${inactif} title="Marquer le rapport comme transmis au secrétariat (double clic)">Marquer transmis</button>`);
  }
  if (peutSupprimer(droits, moi, r)) b.push('<button id="b-supprimer" class="danger" title="Supprimer ce rapport (double clic)">Supprimer</button>');
  return b.join('');
}

// --- Relecture : zone sous chaque rubrique (suggestion, commentaire, commentaires ancrés), dans l'onglet Rédaction et
// dans l'aperçu. Boutons traités par actionRelecture (même code pour la fiche et le cadre de l'aperçu).
const dateCourte = d => String(d || '').split('-').reverse().join('/');
function htmlNotes(r, code, o) {
  const n = lireRelecture(r.Commentaires)[code] || { c: '' };
  const c = esc(code), parts = [];
  if (o.apercu && typeof n.s === 'string') parts.push(`<div class="sugg"><strong>${o.relit ? 'Votre suggestion' : 'Suggestion de l\'IA-IPR'}</strong>
    (ajouts soulignés en bleu, retraits barrés en rouge)${o.repond ? ` <button class="ok" data-trancher="${c}" data-ok="1">Accepter</button><button data-trancher="${c}" data-ok="0">Refuser</button>` : ''}${o.relit ? ` <button data-annuler-sugg="${c}" title="Revenir au texte du rapport">Retirer</button>` : ''}</div>`);
  if (o.apercu && String(n.c || '').trim()) parts.push(`<div class="glob ${n.ok ? 'ok' : ''}"><strong>${n.ok ? '✓ Commentaire traité' : 'Commentaire'}</strong>${o.repond
    ? ` <button data-traiter="${c}" data-ok="${n.ok ? '0' : '1'}">${n.ok ? 'À reprendre' : 'Marquer traité'}</button>` : ''}${o.relit ? ' <span class="muted">(modifiable dans Rédaction)</span>' : ''}<br>${esc(n.c)}</div>`);
  for (const x of n.n || []) parts.push(`<div class="note ${x.ok ? 'ok' : ''}" data-note-id="${esc(x.i)}">${x.ok ? '✓ ' : ''}<span class="q">« ${esc(x.q.length > 90 ? `${x.q.slice(0, 87)}…` : x.q)} »</span>
    ${esc(x.c)} <span class="muted">— ${esc([x.a, dateCourte(x.d)].filter(Boolean).join(', '))}</span>${(o.perdues || []).includes(x.i) ? ' <span class="perdu">(passage modifié depuis)</span>' : ''}${o.repond
    ? ` <button data-note-ok="${esc(x.i)}" data-code="${c}">${x.ok ? 'À reprendre' : 'Traité'}</button>` : ''}${o.relit ? ` <button data-note-suppr="${esc(x.i)}" data-code="${c}">Supprimer</button>` : ''}</div>`);
  return parts.join('');
}
async function actionRelecture(b) {
  await envoyer();
  const x = rapportSel();
  if (!x) return;
  const d = b.dataset;
  const titre = code => (lireStructure(x.Structure).find(y => y.code === code) || {}).titre || code;
  const ipr = { Valideur: moiPers() || x.Valideur };
  if (d.trancher) {
    const ok = d.ok === '1';
    await ecrireRapport([['UpdateRecord', TABLE, x.id, { ...trancher(x.Contenu, x.Commentaires, d.trancher, ok),
      Historique: ajouterHistorique(x.Historique, initialesMoi() || '', `suggestion ${ok ? 'acceptée' : 'refusée'} : ${titre(d.trancher)}`) }]], ok ? 'Suggestion acceptée' : 'Suggestion refusée');
  } else if (d.traiter) {
    await ecrireRapport([['UpdateRecord', TABLE, x.id, { Commentaires: traiter(x.Commentaires, d.traiter, d.ok === '1') }]], d.ok === '1' ? 'Commentaire traité' : 'Commentaire à reprendre');
  } else if (d.annulerSugg) {
    const t = lireObjet(x.Contenu)[d.annulerSugg] || '';
    await ecrireRapport([['UpdateRecord', TABLE, x.id, { Commentaires: suggerer(x.Commentaires, d.annulerSugg, t, t), ...ipr }]], 'Suggestion retirée');
  } else if (d.noteOk) {
    const n = ((lireRelecture(x.Commentaires)[d.code] || {}).n || []).find(y => y.i === d.noteOk);
    await ecrireRapport([['UpdateRecord', TABLE, x.id, { Commentaires: changerNote(x.Commentaires, d.code, d.noteOk, { ok: !(n && n.ok) }) }]], n && n.ok ? 'Commentaire à reprendre' : 'Commentaire traité');
  } else if (d.noteSuppr) {
    await ecrireRapport([['UpdateRecord', TABLE, x.id, { Commentaires: changerNote(x.Commentaires, d.code, d.noteSuppr, null), ...ipr }]], 'Commentaire supprimé');
  } else return;
  afficherFiche();
}
// Commentaire ancré : passage [a, b[ du texte affiché de la rubrique (suggestion de l'IA-IPR s'il y en a une).
let noteEnCours = null;
function commencerNote(code, texte, a, b) {
  let q = texte.slice(a, b);
  const debut = q.length - q.trimStart().length;
  q = q.trim();
  if (!q) return toast('Sélectionner d\'abord un passage du texte.', true);
  const k = occurrence(texte, q, a + debut);
  noteEnCours = { code, q, k: k < 0 ? 0 : k };
  $('note-q').textContent = q;
  $('note-c').value = '';
  $('dlg-note').showModal();
  $('note-c').focus();
}
async function enregistrerNote() {
  const c = $('note-c').value.trim();
  if (!noteEnCours || !c) { $('dlg-note').close(); noteEnCours = null; return; }
  await envoyer();
  const x = rapportSel();
  const { json } = annoter(x.Commentaires, noteEnCours.code, { q: noteEnCours.q, k: noteEnCours.k, c, a: initialesMoi() || '', d: new Date().toISOString().slice(0, 10) });
  $('dlg-note').close(); noteEnCours = null;
  await ecrireRapport([['UpdateRecord', TABLE, x.id, { Commentaires: json, Valideur: moiPers() || x.Valideur }]], 'Commentaire ajouté');
  afficherFiche();
}
// Aperçu à la hauteur de la fenêtre (sous les outils), ou plein écran.
function ajusterApercu() {
  const f = $('apercu');

  const h = fiche.getBoundingClientRect().bottom - f.getBoundingClientRect().top - (barre ? barre.offsetHeight : 48) - 14;
  f.style.height = `${Math.max(360, Math.round(h))}px`;
}
function basculerPlein(oui) {

  if (!cadre) return;

// Position (dans le texte affiché, retraits <del> ignorés) et texte d'une sélection faite dans un bloc de l'aperçu.
function selectionDans(el, rg) {
  const doc = el.ownerDocument;
  const sans = frag => { const d = doc.createElement('div'); d.appendChild(frag); d.querySelectorAll('del').forEach(x => x.remove()); return d.textContent; };
  const avant = doc.createRange();
  avant.setStart(el, 0); avant.setEnd(rg.startContainer, rg.startOffset);
  const a = sans(avant.cloneContents()).length;
  return { a, b: a + sans(rg.cloneContents()).length };
}
// Curseur gardé quand un bloc passe de la vue relue (surlignages, différences) au texte brut à modifier.
function positionCurseur(el) {
  const sel = el.ownerDocument.getSelection();
  if (!sel || !sel.rangeCount || !el.contains(sel.anchorNode)) return -1;
  return selectionDans(el, sel.getRangeAt(0)).a;
}
function placerCurseur(el, pos) {
  const doc = el.ownerDocument, t = el.firstChild;
  if (!t || pos < 0) return;
  const rg = doc.createRange();
  rg.setStart(t, Math.min(pos, t.textContent.length)); rg.collapse(true);
  const sel = doc.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
}

// Aperçu : la page d'impression dans un cadre (même origine : srcdoc). Chaque rubrique y est montrée relue (suggestion
// en différence, passages commentés surlignés) et modifiable sur place selon le rôle : texte du rapport (rédaction),
// suggestion (relecture IA-IPR). Les commentaires ancrés se posent en sélectionnant un passage (IA-IPR).
function brancherApercu(r) {
  const f = $('apercu');
  if (!f) return;
  const parIpr = redigeParIpr(r, D.personnes);
  const redige = peutRediger(droits, moi, r) && !masque();
  const relit = !parIpr && peutRelire(droits, moi, r) && !masque();
  const repond = !parIpr && peutRepondre(droits, moi, r) && !masque();
  f.addEventListener('load', () => {
    const doc = f.contentDocument, win = f.contentWindow;
    if (!doc) return;
    doc.documentElement.style.zoom = String(zoomApercu / 100);
    const texte = code => lireObjet(r.Contenu)[code] || '';
    const sugg = code => { const n = lireRelecture(r.Commentaires)[code]; return n && typeof n.s === 'string' ? n.s : undefined; };
    const mode = code => relit ? 'ipr' : redige && sugg(code) === undefined ? 'redige' : 'lecture';
    const affiche = code => mode(code) === 'ipr' ? sugg(code) ?? texte(code) : texte(code);
    const rendre = code => {
      const bloc = doc.querySelector(`[data-rub="${CSS.escape(code)}"]`);
      if (!bloc) return;
      const el = bloc.querySelector('[data-texte]'), n = lireRelecture(r.Commentaires)[code] || { c: '' };
      const v = vueRelue(texte(code), n.s, n.n || []);
      el.innerHTML = v.html;
      if (mode(code) === 'lecture') el.removeAttribute('contenteditable'); else el.setAttribute('contenteditable', 'plaintext-only');
      bloc.querySelector('.notes').innerHTML = htmlNotes(r, code, { apercu: true, relit, repond, perdues: v.perdues });
    };
    doc.querySelectorAll('[data-rub]').forEach(b => rendre(b.dataset.rub));
    const theme = doc.querySelector('[data-champ]');
    if (theme && redige) theme.setAttribute('contenteditable', 'plaintext-only');
    win.scrollTo(0, scrollApercu);
    win.addEventListener('scroll', () => { scrollApercu = win.scrollY; });
    doc.addEventListener('focusin', e => {
      const el = e.target.closest && e.target.closest('[data-texte]');
      if (!el || !el.querySelector('*')) return;   // déjà en texte brut
      const pos = positionCurseur(el);
      el.textContent = affiche(el.dataset.texte);
      placerCurseur(el, pos);
    });
    doc.addEventListener('input', e => {
      const el = e.target.closest && e.target.closest('[data-texte], [data-champ]');
      if (!el) return;
      const t = el.innerText.replace(/\n$/, '');
      if (el.dataset.champ) { r[el.dataset.champ] = t; noter(r.id, { [el.dataset.champ]: t }); return; }
      const code = el.dataset.texte;
      if (mode(code) === 'ipr') { r.Commentaires = suggerer(r.Commentaires, code, t, texte(code)); noter(r.id, { Commentaires: r.Commentaires, Valideur: moiPers() || r.Valideur }); return; }
      const o = lireObjet(r.Contenu); o[code] = t;
      r.Contenu = JSON.stringify(o);
      noter(r.id, { Contenu: r.Contenu });
    });
    doc.addEventListener('focusout', e => {
      const el = e.target.closest && e.target.closest('[data-texte]');
      if (el) setTimeout(() => { if (doc.activeElement !== el) rendre(el.dataset.texte); }, 0);
      envoyer();
    });
    doc.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); envoyer(); }
      if (e.key === 'Escape' && pleinEcran) basculerPlein(false);
    });
    // Boutons des zones de relecture ; passage surligné ↔ son commentaire.
    doc.addEventListener('click', e => {
      const b = e.target.closest && e.target.closest('[data-trancher], [data-traiter], [data-note-ok], [data-note-suppr], [data-annuler-sugg]');
      if (b) { e.preventDefault(); actionRelecture(b); return; }
      const m = e.target.closest && e.target.closest('mark[data-note], .note[data-note-id]');
      doc.querySelectorAll('.actif').forEach(x => x.classList.remove('actif'));
      if (!m) return;
      const id = m.dataset.note || m.dataset.noteId;
      doc.querySelectorAll(`mark[data-note="${CSS.escape(id)}"], .note[data-note-id="${CSS.escape(id)}"]`).forEach(x => x.classList.add('actif'));
      const cible = doc.querySelector(m.dataset.note ? `.note[data-note-id="${CSS.escape(id)}"]` : `mark[data-note="${CSS.escape(id)}"]`);
      if (cible) cible.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    if (!relit) return;
    // Sélection d'un passage : bouton « Commenter » à côté.
    const btn = doc.createElement('button');
    btn.id = 'commenter'; btn.type = 'button'; btn.textContent = '💬 Commenter'; btn.hidden = true;
    doc.body.appendChild(btn);
    let choix = null;
    doc.addEventListener('mouseup', e => { if (e.target === btn) return; setTimeout(() => {
      const sel = doc.getSelection();
      choix = null; btn.hidden = true;
      if (!sel || sel.isCollapsed || !sel.rangeCount) return;
      const rg = sel.getRangeAt(0);
      const noeud = n => n && (n.nodeType === 1 ? n : n.parentElement);
      const el = noeud(rg.startContainer) && noeud(rg.startContainer).closest('[data-texte]');
      if (!el || !el.contains(rg.endContainer)) return;
      const { a, b } = selectionDans(el, rg);
      if (b <= a) return;
      choix = { code: el.dataset.texte, a, b };
      const box = rg.getBoundingClientRect();
      btn.style.left = `${box.left + win.scrollX}px`; btn.style.top = `${box.bottom + win.scrollY + 4}px`;
      btn.hidden = false;
    }, 0); });
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      btn.hidden = true;
      if (!choix) return;
      const el = doc.querySelector(`[data-rub="${CSS.escape(choix.code)}"] [data-texte]`);
      // texte affiché : brut si le bloc est en cours de saisie, sinon vue relue (retraits ignorés) — même texte.
      commencerNote(choix.code, el && !el.querySelector('*') ? el.textContent : affiche(choix.code), choix.a, choix.b);
    });
  });
  f.srcdoc = htmlImpression(r, contexte(r), { apercu: true });
}

  ajusterApercu();
  const echelleR = echellePour(typeDe(r), D.params).map(e => e.cle);

  fiche.querySelectorAll('[data-md]').forEach(i => i.addEventListener('change', () => {

    // Plan d'inspection d'abord : lien vers ce rapport effacé (et la date calée que le rapport avait posée).

    if (plan.length) await ecrire(plan, 'Visite du plan : rapport retiré');
    if (await ecrire([['RemoveRecord', TABLE, r.id]], 'Rapport supprimé')) { choisir(0); await charger(); afficherFiche(); }

// --- Bibliothèque personnelle : ajouter un passage du rapport à ses phrases types ---
const droitsPhrases = () => droitsTable(moi, 'Phrases');
const peutAjouterPhrase = () => { const d = droitsPhrases(); return d.C === 'Oui' || (d.C === 'Limité' && !!moiPers()); };
function ouvrirMaPhrase(r, code, passage) {
  const rub = D.rubriques.find(x => x.Code === code);
  if (!rub) return toast('Rubrique introuvable dans les modèles : ajout impossible.', true);
  const valideur = droitsPhrases().M === 'Oui', avecPartage = D.phrases.length === 0 || 'Partagee' in D.phrases[0];
  const echelle = typeDe(r).Positionnement ? echellePour(typeDe(r), D.params) : [];
  const rangs = echelle.length ? rangsPositionnement(r.Positionnement, echelle) : {};
  const codes = [...new Set([...grillePour(typeDe(r), D.competences).map(k => String(k.Code)), 'P1', 'P2', 'P3', 'P4', 'P5', 'MD1', 'MD2', 'MD3'])];
  const comp = competenceDuPassage(passage, codes);
  const texte = generaliserPhrase(comp ? passage.replace(/^\s*(?:[-•*–]\s*)?[A-Z]{1,2}\d{1,2}\s*[:–-]?\s*/, '') : passage,
    { civilite: r.Prof_civilite, nom: r.Prof_nom, prenom: r.Prof_prenom });
  $('mp-corps').innerHTML = `<p class="petit muted">Rubrique « ${esc(rub.Titre)} ». Le nom du ou de la professeur·e est remplacé par {civilite} {nom} : la phrase servira pour d'autres rapports.</p>
    <label class="champ"><span>Phrase</span><textarea id="mp-texte" rows="4">${esc(texte)}</textarea></label>
    <div class="grille">
      <label class="champ"><span>Compétence</span><select id="mp-comp"><option value="">—</option>${codes.map(c => `<option ${c === comp ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="champ"><span>Niveau</span><select id="mp-niv"><option value="">tous niveaux</option>${[1, 2, 3, 4].map(n => `<option value="${n}" ${comp && rangs[comp] === n ? 'selected' : ''}>${n}${echelle[n - 1] ? ' – ' + esc(echelle[n - 1].cle) : ''}</option>`).join('')}</select></label>
      <label class="champ"><span>Nature</span><select id="mp-nat">${['', 'Point fort', 'Conseil', 'Vigilance', 'Autre'].map(x => `<option value="${esc(x)}">${esc(x || '—')}</option>`).join('')}</select></label>
    </div>
    ${!valideur && avecPartage ? '<label class="champ"><input type="checkbox" id="mp-partage"> Proposer à tous (validation par un·e IA-IPR)</label>' : ''}
    ${valideur ? '<p class="petit muted">Vos phrases sont validées d\'office : elles sont proposées à tout le monde.</p>' : ''}`;
  $('mp-comp').addEventListener('change', () => { const c = $('mp-comp').value; $('mp-niv').value = c && rangs[c] ? String(rangs[c]) : ''; });
  $('mp-ok').onclick = async () => {
    const t = $('mp-texte').value.trim();
    if (!t) return toast('Phrase vide.', true);
    if (D.phrases.some(p => norm(p.Texte).trim() === norm(t))) return toast('Cette phrase est déjà dans la bibliothèque.', true);
    const ordre = (Math.floor(Math.max(0, ...D.phrases.map(p => Number(p.Ordre) || 0)) / 10) + 1) * 10;
    const v = { Rubrique: rub.id, Competence: $('mp-comp').value, Niveau: Number($('mp-niv').value) || null, Nature: $('mp-nat').value,
      Texte: t, Auteur: moiPers() || 0, Validee: valideur, Ordre: ordre };
    if (avecPartage) v.Partagee = valideur || !!($('mp-partage') && $('mp-partage').checked);
    if (!('Niveau' in (D.phrases[0] || { Niveau: 0 }))) delete v.Niveau;
    if (await ecrire([['AddRecord', 'Phrases', null, v]], 'Ajoutée à vos phrases', charger)) $('dlg-maphrase').close();
  };
  $('mp-annuler').onclick = () => $('dlg-maphrase').close();
  $('dlg-maphrase').showModal();
}

// --- Phrases types (panneau de droite) ---
function afficherPhrases() {
  const r = rapportSel();
  const panneau = $('phrases');
  if (!r || creation || onglet !== 'redaction' || !peutRediger(droits, moi, r) || masque()) { panneau.hidden = true; return; }
  panneau.hidden = false;
  const code = rubriqueActive || (lireStructure(r.Structure)[0] || {}).code || '';
  const rub = D.rubriques.find(x => x.Code === code);
  if (!rub) { panneau.innerHTML = '<p class="muted">Clique dans une rubrique pour voir ses phrases types.</p>'; return; }
  const echelle = typeDe(r).Positionnement ? echellePour(typeDe(r), D.params) : [];
  const rangs = echelle.length ? rangsPositionnement(r.Positionnement, echelle) : {};
  const positionne = Object.keys(rangs).length > 0;
  const liste_ = phrasesPour(D.phrases, rub.id, { competence: competenceFiltre, recherche: $('ph-q') ? $('ph-q').value : '', moi: moiPers(),
    niveaux: positionne && !tousNiveaux ? rangs : {} });
  const nbNiv = Math.max(4, ...D.phrases.map(p => Number(p.Niveau) || 0));
  const libNiv = n => (echelle[n - 1] || {}).cle || `niveau ${n}`;
  const avecNiveaux = D.phrases.some(p => p.Rubrique === rub.id && p.Competence && Number(p.Niveau));
  const comps = [...new Set(D.phrases.filter(p => p.Rubrique === rub.id && p.Competence).map(p => p.Competence))].sort();
  const v = { civilite: r.Prof_civilite, nom: r.Prof_nom, prenom: r.Prof_prenom };
  const q = $('ph-q') ? $('ph-q').value : '';
  panneau.innerHTML = `<h2>Phrases types — ${esc(rub.Titre)}</h2>
    <input type="search" id="ph-q" placeholder="Filtrer…" value="${esc(q)}" style="width:100%;margin-bottom:6px">
    ${comps.length ? `<div class="filtres"><button data-comp="" class="${competenceFiltre ? '' : 'actif'}">Toutes</button>${comps.map(c => `<button data-comp="${esc(c)}" class="${c === competenceFiltre ? 'actif' : ''}"
      ${rangs[c] ? `title="Positionné·e : ${esc(libNiv(rangs[c]))}"` : ''}>${rangs[c] ? `<span class="pastille" style="background:${couleurNiveau(rangs[c], echelle.length)}"></span>` : ''}${esc(c)}</button>`).join('')}</div>` : ''}
    ${positionne && avecNiveaux ? `<label class="petit" style="display:block;margin-bottom:6px"><input type="checkbox" id="ph-tous" ${tousNiveaux ? 'checked' : ''}> Tous les niveaux
      <span class="muted">(sinon, pour une compétence positionnée, seules les phrases de son niveau)</span></label>` : ''}
    ${liste_.length ? liste_.map(p => { const n = Number(p.Niveau) || 0; return `<div class="phrase" data-phrase="${p.id}" title="Insérer à la position du curseur"
      ${n && p.Competence ? `style="--niv:${couleurNiveau(n, echelle.length || nbNiv)}"` : ''}>${esc(remplirChamps(p.Texte, v))}
      <span class="meta">${esc([p.Nature, p.Competence, n && p.Competence ? libNiv(n) : '', p.Validee ? '' : p.Partagee === false ? 'ma phrase' : 'ma phrase, proposée à tous'].filter(Boolean).join(' · '))}</span></div>`; }).join('')
      : '<p class="muted">Aucune phrase pour cette rubrique.</p>'}`;
  const champ = $('ph-q');
  champ.addEventListener('input', () => { const pos = champ.selectionStart; afficherPhrases(); const c2 = $('ph-q'); c2.focus(); c2.setSelectionRange(pos, pos); });
  panneau.querySelectorAll('[data-comp]').forEach(b => b.addEventListener('click', () => { competenceFiltre = b.dataset.comp; afficherPhrases(); }));
  if ($('ph-tous')) $('ph-tous').addEventListener('change', e => { tousNiveaux = e.target.checked; afficherPhrases(); });
  panneau.querySelectorAll('[data-phrase]').forEach(d => d.addEventListener('click', () => {
    const p = D.phrases.find(x => x.id === Number(d.dataset.phrase));
    const t = champActif && document.body.contains(champActif) ? champActif : $('fiche').querySelector(`[data-texte="${CSS.escape(code)}"], [data-sugg="${CSS.escape(code)}"]`);
    if (!p || !t) return;
    const { texte, curseur } = inserer(t.value, t.selectionStart ?? t.value.length, t.selectionEnd ?? t.value.length, remplirChamps(p.Texte, v));
    t.value = texte; t.focus(); t.setSelectionRange(curseur, curseur);
    t.dispatchEvent(new Event('input'));
  }));
}

// --- Signature ---
// Signature enregistrée (table Signatures, la sienne seulement) ou collée ; au premier collage, proposer de
// l'enregistrer. `faire(img)` écrit la signature sur le rapport.
const maSignature = () => D.signatures.find(s => moi && String(s.Email || '').toLowerCase() === String(moi.Email || '').toLowerCase());
let signatureEnCours = null;
function demanderSignature(titre, explication, faire) {
  const s = maSignature();
  signatureEnCours = { faire, image: (s && s.Image) || '' };
  $('sig-titre').textContent = titre;
  const corps = () => {
    const img = signatureEnCours.image;
    $('sig-corps').innerHTML = `<p class="petit">${esc(explication)}</p>
      <div id="collage" tabindex="0">${img ? `<img src="${esc(img)}" alt="Ma signature">` : 'Clique ici puis colle l\'image de ta signature (Ctrl / Cmd + V)'}</div>
      <div class="actions"><label class="petit"><input type="file" id="sig-fichier" accept="image/*" style="max-width:220px"></label>
        ${img ? '<button id="sig-effacer" class="lien">Changer d\'image</button>' : ''}</div>
      ${img && (!s || s.Image !== img) ? '<label class="petit" style="display:block;margin-top:6px"><input type="checkbox" id="sig-garder" checked> Voulez-vous enregistrer votre signature dans cette interface ? (visible de vous seul·e)</label>' : ''}`;
    $('sig-ok').disabled = !img;
    $('collage').addEventListener('paste', e => {
      const f = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
      if (f) { e.preventDefault(); lireImage(f.getAsFile()).then(d => { signatureEnCours.image = d; corps(); }); }
      else toast('Le presse-papiers ne contient pas d\'image.', true);
    });
    $('sig-fichier').addEventListener('change', e => { const f = e.target.files[0]; if (f) lireImage(f).then(d => { signatureEnCours.image = d; corps(); }); });
    if ($('sig-effacer')) $('sig-effacer').addEventListener('click', () => { signatureEnCours.image = ''; corps(); });
  };
  corps();
  $('dlg-signature').showModal();
}
// Image → PNG redimensionné (480 × 180 au plus), en data URL.
function lireImage(fichier) {
  return new Promise((ok, ko) => {
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const im = new Image();
      im.onload = () => {
        const { l, h } = tailleSignature(im.naturalWidth, im.naturalHeight);
        const c = document.createElement('canvas'); c.width = l; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, l, h);
        ok(c.toDataURL('image/png'));
      };
      im.onerror = () => { toast('Image illisible.', true); ko(new Error('image')); };
      im.src = String(lecteur.result);
    };
    lecteur.readAsDataURL(fichier);
  });
}
async function validerSignature() {
  const s = signatureEnCours;
  if (!s || !s.image) return;
  $('dlg-signature').close();
  if ($('sig-garder') && $('sig-garder').checked && moi && moi.Email) {
    const m = maSignature();
    await ecrire(m ? [['UpdateRecord', 'Signatures', m.id, { Image: s.image, Modifie_le: aujourdhuiGrist() }]]
      : [['AddRecord', 'Signatures', null, { Email: String(moi.Email).trim().toLowerCase(), Image: s.image, Modifie_le: aujourdhuiGrist() }]], 'Signature enregistrée');
  }
  signatureEnCours = null;
  await s.faire(s.image);
  afficherFiche();
}

// --- Impression et mail ---
function contexte(r) {
  const t = typeDe(r), a = personne(r.Auteur) || {}, v = personne(r.Valideur) || {};
  return { titreDocument: t.Titre || 'RAPPORT DE VISITE', entete: String(D.params.entete || 'Inspection pédagogique régionale').split('\n'),
    discipline: D.params.discipline || '', cmi: nomPers(r.Auteur), titreCmi: a.Titre_signature || 'Le ou la chargé·e de mission',
    ipr: nomPers(r.Valideur), titreIpr: v.Titre_signature || 'L\'IA-IPR', nomFichier: nomFichierPdf(r, a.Initiales || ''),
    sansCmi: redigeParIpr(r, D.personnes), pied: D.params.pied || 'RAPPORT DE VISITE - inspection de mathématiques',
    tailleSignature: D.params.taille_signature || 15 };
}
function ouvrirOnglet(html, nom) {
  let w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (w) { w.document.open(); w.document.write(html); w.document.close(); toast('Ouvert dans un nouvel onglet : Ctrl / Cmd + P → Enregistrer au format PDF.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = `${nom}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast('Nouvel onglet bloqué : page téléchargée (.html), à ouvrir puis imprimer.');
}
function imprimer(r) { const c = contexte(r); ouvrirOnglet(htmlImpression(r, c), c.nomFichier); }
// Échange CMi ↔ IA-IPR pendant la relecture : messagerie ouverte, texte prêt.
function echange(r, type) {
  const v = { etablissement: [r.Etab_nom, r.Etab_commune].filter(Boolean).join(', '), professeur: [r.Prof_civilite, r.Prof_prenom, r.Prof_nom].filter(Boolean).join(' '),
    auteur: nomPers(r.Auteur), ipr: nomPers(r.Valideur), date: dateFr(r.Date_visite) };
  const lien = lienEchange(type, r, D.personnes, D.params, v);
  if (!lien) { toast(`Adresse e-mail ${MAILS_RELECTURE[type].vers === 'ipr' ? 'de l\'IA-IPR' : 'du ou de la CMi'} absente : la renseigner dans l'Annuaire.`, true); return; }
  const a = document.createElement('a');
  a.href = lien; a.target = '_top';
  document.body.appendChild(a); a.click(); a.remove();
}
function preparerMail(r) {
  const t = typeDe(r), d = destinataires(r, t.Code, D.personnes, D.params.secretariat || '');
  if (!d.a) { toast('Adresse du secrétariat absente : Parametres → secretariat.', true); return; }
  const v = { etablissement: [r.Etab_nom, r.Etab_commune].filter(Boolean).join(', '), professeur: [r.Prof_civilite, r.Prof_nom, r.Prof_prenom].filter(Boolean).join(' '),
    auteur: nomPers(r.Auteur), date: dateFr(r.Date_visite) };
  const a = document.createElement('a');
  a.href = lienMailto(d.a, d.cc, remplirMail(D.params.mail_objet || 'Rapport de visite – {etablissement}', v), remplirMail(D.params.mail_texte || '', v));
  a.target = '_top';
  document.body.appendChild(a); a.click(); a.remove();
  toast(`Messagerie ouverte : joins le PDF ${contexte(r).nomFichier}.pdf, puis « Marquer transmis ».`);
}

// --- Chargement ---
const change = detecteurChangement();
const occupe = () => !!brouillon || envoiEnCours || !!creation || !!importation || $('dlg-signature').open
  || (document.activeElement && $('fiche').contains(document.activeElement) && /TEXTAREA|INPUT|IFRAME/.test(document.activeElement.tagName));
const charger = sansChevauchement(async () => {
  const noms = ['Rapports', 'Types_rapport', 'Rubriques', 'Phrases', 'Personnes', 'Professeurs', 'Etablissements', 'Parametres', 'Competences_MD', 'Signatures', 'Utilisateurs', 'Visites'];
  const lus = await Promise.all([...noms.map(lireTable), CHIFFREMENT ? lireTable(TABLE_CHIFFREMENT) : { lignes: [] }]);
  const T = Object.fromEntries(noms.map((n, i) => [n, lus[i]]));
  if (CHIFFREMENT && !cleLue) { cleLue = true; cle = await cleAuDemarrage(ligneChiffrementValide(lus[noms.length].lignes)); }
  if (T.Rapports.erreur) {
    message(`Impossible de lire la table Rapports : ${T.Rapports.erreur} — elle n'existe pas, ou tes droits ne permettent pas de la lire.`, true);
    $('app').hidden = true; return;
  }
  D.rapports = await lignesLisibles(cle, TABLE, T.Rapports.lignes, CHIFFREMENT, cacheChiffre);
  D.types = [...(T.Types_rapport.lignes || [])].sort((a, b) => (Number(a.Ordre) || 0) - (Number(b.Ordre) || 0));
  D.rubriques = T.Rubriques.lignes || []; D.phrases = T.Phrases.lignes || []; D.personnes = T.Personnes.lignes || [];
  D.profs = T.Professeurs.lignes || []; D.etabs = T.Etablissements.lignes || []; D.competences = T.Competences_MD.lignes || [];
  D.signatures = T.Signatures.lignes || []; D.visites = T.Visites.lignes || [];   // Visites : table du plan (absente = aucune)
  D.params = Object.fromEntries((T.Parametres.lignes || []).map(p => [String(p.Cle || ''), String(p.Valeur ?? '')]));
  moi = identifierMoi(T.Utilisateurs.lignes).moi;
  droits = droitsTable(moi, TABLE);
  if (sel && !D.rapports.some(x => x.id === sel)) choisir(0);
  const demande = demandeConteneur();   // venue du Plan d'inspection, prise une seule fois
  if (!change([T.Rapports.lignes, T.Phrases.lignes, T.Rubriques.lignes, T.Personnes.lignes, T.Signatures.lignes, sel, !!cle, moi && moi.Droits]) && !$('app').hidden) { traiterDemande(demande); return; }
  message('');
  if ($('app').hidden && sel) { onglet = ongletDe(sel); replier(true); }   // premier affichage : rapport repris, liste repliée
  $('app').hidden = false;
  afficherListe();
  if (!occupe()) afficherFiche();
  traiterDemande(demande);
});
// Demande d'un autre écran (Plan d'inspection) : { rapport } l'ouvre ; { visite } prépare le rapport de cette visite.
async function traiterDemande(d) {
  if (!d) return;
  if (d.rapport && D.rapports.some(r => r.id === d.rapport)) {
    await envoyer(); creation = null; onglet = ongletDe(d.rapport); choisir(d.rapport); replier(true); afficherListe(); afficherFiche(); return;
  }
  const v = d.visite && D.visites.find(x => x.id === d.visite);
  if (!v) return;
  if (v.Rapport) { traiterDemande({ rapport: v.Rapport }); return; }
  if (!peutCreer(droits, moi)) { toast('Création de rapport impossible : ton compte n\'a pas ce droit.', true); return; }
  await envoyer(); replier(true);
  const prof = D.profs.find(x => x.id === v.Professeur);
  const a = personne(v.CMi) || personne(moiPers());
  creation = { q: prof ? '' : [v.Prof_nom, v.Prof_prenom].filter(Boolean).join(' '), uai: prof ? '' : v.UAI || '', prof: prof ? prof.id : 0,
    typeCode: typePropose(prof), date: dateIso(v.Date_prevue) || new Date().toISOString().slice(0, 10), heure: '', classe: '', effectif: '',
    theme: '', valideur: (a && (a.Fonction === 'IA-IPR' ? a.id : a.Referent)) || 0, auteur: a ? a.id : 0, visite: v.id };
  afficherFiche();
}
const planifier = regrouper(charger);

// --- Démarrage ---
if (await initialiserGrist()) {
  grist.ready({ requiredAccess: 'full', allowSelectBy: false });
  grist.onRecords(planifier);
  installerBulles();
  $('recherche').addEventListener('input', afficherListe);
  $('filtre').value = pref.lire('Filtre', '');
  $('filtre').addEventListener('change', () => { pref.ecrire('Filtre', $('filtre').value); afficherListe(); });
  $('recharger').addEventListener('click', () => relireSansCache(charger));
  if (CHIFFREMENT) suivreCle(k => { cle = k; cacheChiffre.clear(); charger().then(() => { if (!brouillon) afficherFiche(); }); });
  $('nouveau').addEventListener('click', async () => {
    if ($('nouveau').classList.contains('inactif')) { toast($('nouveau').title + '.', true); return; }
    await envoyer(); replier(true);
    const a = personne(moiPers());
    creation = { q: '', uai: '', prof: 0, typeCode: 'CLASSIQUE', date: new Date().toISOString().slice(0, 10), heure: '', classe: '', effectif: '',
      theme: '', valideur: (a && a.Fonction === 'IA-IPR' ? a.id : a && a.Referent) || 0, auteur: a ? a.id : 0 };
    afficherFiche();
  });
  $('replier').addEventListener('click', () => replier(true));
  $('importer').addEventListener('click', async () => { await envoyer(); creation = null; importation = { etape: 'coller', texte: '' }; replier(true); afficherFiche(); });
  $('fiche').addEventListener('click', e => {
    const b = e.target.closest('[data-trancher], [data-traiter], [data-note-ok], [data-note-suppr], [data-annuler-sugg]');
    if (b) actionRelecture(b);
  });
  $('note-ok').addEventListener('click', enregistrerNote);
  $('note-annuler').addEventListener('click', () => { noteEnCours = null; $('dlg-note').close(); });
  $('note-c').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') enregistrerNote(); });
  window.addEventListener('resize', () => ajusterApercu());
  $('deplier').addEventListener('click', () => replier(false));
  $('deplier-texte').addEventListener('click', () => replier(false));
  $('nouveau-bande').addEventListener('click', () => $('nouveau').click());
  $('liste').addEventListener('click', async e => {
    const g = e.target.closest('[data-groupe]');
    if (g) { const k = g.dataset.groupe; ouverts.has(k) ? ouverts.delete(k) : ouverts.add(k); pref.ecrire('Ouverts', JSON.stringify([...ouverts])); afficherListe(); return; }
    const li = e.target.closest('li[data-id]');
    if (!li) return;
    await envoyer();
    creation = null; rubriqueActive = ''; champActif = null;
    if (Number(li.dataset.id) !== sel) onglet = ongletDe(Number(li.dataset.id));
    choisir(Number(li.dataset.id)); replier(true);
    afficherListe(); afficherFiche();
  });
  $('sig-ok').addEventListener('click', validerSignature);
  $('sig-annuler').addEventListener('click', () => { signatureEnCours = null; $('dlg-signature').close(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); envoyer(); }
    if (e.key === 'Escape' && creation && !$('dlg-signature').open) { creation = null; afficherFiche(); }
    if (e.key === 'Escape' && pleinEcran && !$('dlg-note').open) basculerPlein(false);
  });
  window.addEventListener('beforeunload', () => { if (brouillon) envoyer(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) envoyer(); else planifier(); });
  relectureReguliere(charger, occupe);
  await charger();
}
</script>
