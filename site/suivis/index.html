<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapports et suivis — Suivis pour Grist</title>
<link rel="icon" type="image/svg+xml" href="../commun/favicon.svg?v=2">
<link rel="stylesheet" href="../commun/style.css">
<style>
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .barre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .barre h1 { font-size: 17px; margin: 0 8px 0 0; }
  .onglets { display: flex; gap: 2px; }
  .onglets button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; }
  .onglets button.actif { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  .barre .espace { flex: 1; }
  #aide { border-radius: 50%; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none; color: var(--fg); background: var(--bg2); border: 1px solid var(--border); }
  #aide:hover { border-color: var(--accent); color: var(--accent); }
  #contenu { flex: 1; overflow-y: auto; padding: 12px; }
  .compteurs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .compteurs button { display: flex; flex-direction: column; align-items: flex-start; min-width: 110px; padding: 4px 10px; border-left: 4px solid var(--border); }
  .compteurs button b { font-size: 20px; line-height: 1.1; }
  .compteurs button span { font-size: 12px; color: var(--muted); }
  .compteurs button.actif { background: var(--sel); border-color: var(--accent); }
  .compteurs .c-a_visiter { border-left-color: var(--danger); } .compteurs .c-plan { border-left-color: var(--info); }
  .compteurs .c-visite { border-left-color: var(--accent); } .compteurs .c-ok { border-left-color: var(--muted); }
  .ajouter { border: 1px solid var(--info); background: color-mix(in srgb, var(--info) 8%, transparent); border-radius: 6px; padding: 8px 12px;
    margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .ajouter .noms { flex: 1; min-width: 200px; }
  .outils { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 8px; font-size: 13px; }
  .outils input[type=search] { flex: 1; min-width: 180px; }
  .legende { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; margin-bottom: 8px; }
  svg.question { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .rond { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: var(--bg2); border: 1px solid rgba(0,0,0,.18); vertical-align: -2px; }
  table.suivi { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.suivi th { position: sticky; top: -12px; background: var(--bg); z-index: 1; text-align: center; font-weight: 600; padding: 6px 4px; border-bottom: 2px solid var(--border); }
  table.suivi th:first-child, table.suivi td:first-child { text-align: left; }
  table.suivi td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
  table.suivi th.courante { color: var(--accent); background: var(--sel); border-bottom-color: var(--accent); }
  table.suivi td.courante { background: var(--sel); }
  td.case { cursor: pointer; min-width: 64px; white-space: nowrap; }
  td.case:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.case .ronds { display: inline-flex; gap: 3px; padding: 3px 5px; border-radius: 10px; }
  td.case.rapport .ronds { box-shadow: 0 0 0 1.5px var(--accent) inset; }
  td.case .vide { color: var(--border); }
  td.case.lecture { cursor: default; } td.case.lecture:hover { outline: none; }
  td.nom { cursor: pointer; min-width: 170px; } td.nom:hover .n { color: var(--accent); text-decoration: underline; }
  td.nom .det { display: block; font-size: 12px; color: var(--muted); }
  tr.ancien td.nom .n { color: var(--muted); }
  .etiquette { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; border: 1px solid var(--border); background: var(--bg2); }
  .e-a_visiter { border-color: var(--danger); color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .e-plan { border-color: var(--info); color: var(--info); }
  .e-visite { border-color: var(--accent); color: var(--accent); }
  dialog { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); max-width: 760px; width: calc(100% - 24px); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 4px; font-size: 17px; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0 12px; }
  .comp { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .comp h3 { font-size: 13px; margin: 0 0 6px; }
  .niveaux { display: flex; gap: 6px; flex-wrap: wrap; }
  .niveaux label { display: inline-flex; gap: 5px; align-items: center; padding: 3px 9px; border: 1px solid var(--border); border-left: 5px solid var(--niv); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .niveaux label.choisi { background: color-mix(in srgb, var(--niv) 16%, transparent); border-color: var(--niv); }
  .comp textarea { width: 100%; min-height: 36px; margin-top: 6px; font-size: 13px; }
  .comp .phrase { font-size: 13px; margin-top: 4px; }
  .suggestions { border: 1px solid var(--border); border-radius: 4px; max-height: 180px; overflow-y: auto; margin-top: 2px; }
  .suggestions div { padding: 4px 8px; cursor: pointer; font-size: 13px; } .suggestions div:hover { background: var(--sel); }
  table.stg { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.stg th { position: sticky; top: -12px; background: var(--bg); z-index: 1; text-align: left; font-weight: 600; padding: 6px 6px; border-bottom: 2px solid var(--border); }
  table.stg td { padding: 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.stg tr.cliquable { cursor: pointer; } table.stg tr.cliquable:hover td { background: var(--sel); }
  table.stg tr.ecarte td { color: var(--muted); }
  table.stg .det { display: block; font-size: 12px; color: var(--muted); }
  .manque { color: var(--warn); font-size: 12px; }
  .tuteurs-liste { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .tuteurs-liste div { display: flex; gap: 8px; align-items: center; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  .tuteurs-liste div span { flex: 1; }
  .apercu-import { max-height: 50vh; overflow-y: auto; font-size: 13px; }
  .apercu-import table { width: 100%; border-collapse: collapse; } .apercu-import td, .apercu-import th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  .apercu-import .alerte-l { color: var(--warn); font-size: 12px; display: block; }
  .bientot { max-width: 620px; margin: 40px auto; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { body.plein-ecran { overflow: auto; height: auto; } table.suivi { display: block; overflow-x: auto; }
    .compteurs button { min-width: 0; flex: 1 1 40%; } }
</style>
</head>
<body class="plein-ecran">
<div id="msg">Chargement…</div>
<div id="app" hidden>
  <div class="barre">
    <h1>Suivis</h1>
    <div class="onglets" id="onglets">
      <button data-onglet="md">Suivi MD</button>
      <button data-onglet="pstg">Suivi PSTG</button>
    </div>
    <span class="espace"></span>
    <button id="recharger" title="Relire les tables">↻</button>
    <a id="aide" href="tuto.html" target="_blank" rel="noopener" title="Aide : mode d'emploi des suivis">?</a>
  </div>
  <main id="contenu"></main>
</div>

<dialog id="dlg-bilan"><form method="dialog" id="f-bilan"></form></dialog>
<dialog id="dlg-md"><form method="dialog" id="f-md"></form></dialog>
<dialog id="dlg-stg"><form method="dialog" id="f-stg"></form></dialog>
<dialog id="dlg-import"><form method="dialog" id="f-import"></form></dialog>
<dialog id="dlg-plan"><form method="dialog" id="f-plan"></form></dialog>
<input type="file" id="fichier-csv" accept=".csv,.tsv,.txt,text/csv" hidden>

<script type="module">
import { $, esc, message, toast, installerBulles, preferences, boutonConfirmation } from '../commun/interface.js';
import { identifierMoi, droitsTable } from '../commun/droits.js';
import { initialiserGrist, lireTable, ecrire, sansChevauchement, regrouper, relectureReguliere, relireSansCache, detecteurChangement,
  hoteEcran } from '../commun/grist.js';
import { norm, nomFiche } from '../commun/donnees.js';
import { CHIFFREMENT } from '../commun/config.js';
import { TABLE_CHIFFREMENT, ligneChiffrementValide, lignesLisibles, tableChiffree, chiffrerActions, cleAuDemarrage, suivreCle } from '../commun/chiffrement.js';
import { aujourdhui, rentreeDe, libelleAnnee, dateFr, dateIso, isoVersGrist } from '../plan/logique.js';
import { grillePour, echellePour, couleurNiveau, lirePositionnement, positionner, descripteurs } from '../rapports/logique.js';
import { TABLE, TABLE_BILANS, PERIODE_ANS, ETATS_MD, estMd, identiteProf, ligneMd, mdsAAjouter, anneesSuivi, pastilles, lignesSuivi, filtrerMds,
  compterEtats, derniereAnnee, validerMd, validerBilan, sansEvaluation, calendrierAnnee, droitsSuivi } from './logique.js';
import { TABLE_STAGIAIRES, TABLE_TUTORATS, CORPS, CONCOURS, QUOTITES, SUIVIS, codesStagiaires, stagiairesAAjouter, ligneStagiaire, ligneTuteur,
  statutStagiaire, tuteursDe, filtrerStagiaires, anneesStagiaires, manques, validerStagiaire, csvModele, lireCsvStagiaires,
  preparerImportStagiaires, sansVisite, visitePour, cmisDe, visitesDe, droitsStagiaires } from './stagiaires.js';
import { telechargerFichier } from '../commun/export.js';
import { etat as etatVisite } from '../plan/logique.js';

const pref = preferences('Suivis');
const D = { mds: [], bilans: [], rapports: [], profs: [], etabs: [], personnes: [], types: [], competences: [], visites: [], params: {},
  stagiaires: [], tutorats: [] };
let erreurMd = '', erreurStg = '', droitsStg = droitsStagiaires(droitsTable(null, TABLE_STAGIAIRES), droitsTable(null, TABLE_TUTORATS));
let peutPlanifier = false;
const filtreStg = { q: '', ecartes: pref.lire('Ecartes', '0') === '1', annee: '' };
let moi = null, droits = droitsSuivi(droitsTable(null, TABLE), droitsTable(null, TABLE_BILANS));
let onglet = pref.lire('Onglet', 'md') === 'pstg' ? 'pstg' : 'md';
const filtre = { q: '', etat: '', anciens: pref.lire('Anciens', '0') === '1' };
const rentree = rentreeDe(aujourdhui());
let cle = null, cleLue = false;
const cache = new Map();
const masque = () => tableChiffree(CHIFFREMENT, TABLE_BILANS) && !cle;
const TIP_MASQUE = 'Positionnements chiffrés masqués : « Révéler » (menu de l\'application) pour les voir et les saisir';
let enCours = null;       // bilan ou fiche en cours de saisie (fenêtre ouverte)
const change = detecteurChangement();
const occupe = () => !!enCours;

const typeMd = () => D.types.find(t => String(t.Code || '').toUpperCase() === 'MD');
const grille = () => grillePour(typeMd(), D.competences);
const niveaux = () => echellePour(typeMd(), D.params).map(e => e.cle);
const personne = id => D.personnes.find(p => p.id === id);
const nomPers = id => { const p = personne(id); return p ? nomFiche(p) : ''; };
const nomMd = m => [m.Civilite, m.Nom, m.Prenom].filter(Boolean).join(' ');
// Icône Lucide « circle-question-mark » (https://lucide.dev, licence ISC) : visite notée sans évaluation.
const IC_QUESTION = '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>';
const ronds = (pos, titre) => { const p = pastilles(pos, grille(), niveaux());
  return `<span class="ronds" title="${esc(titre)}">${sansEvaluation(p)
    ? p.map(() => `<svg class="question" viewBox="0 0 24 24" aria-hidden="true">${IC_QUESTION}</svg>`).join('')
    : p.map(x => `<span class="rond" style="${x.couleur ? `background:${x.couleur}` : ''}"></span>`).join('')}</span>`; };
function infobulle(c) {
  const p = pastilles(c.positionnement, grille(), niveaux());
  return [`${c.annee} — ${c.source === 'rapport' ? 'rapport' : 'bilan saisi'}${c.visiteur ? ` · ${nomPers(c.visiteur)}` : ''}${c.date ? ` · ${dateFr(c.date)}` : ''}`,
    ...p.map(x => `${x.code} : ${x.niveau || '—'}${x.phrase ? ` — ${x.phrase}` : ''}`)].join('\n');
}

// --- Lecture ---
const charger = sansChevauchement(async () => {
  const noms = [TABLE, TABLE_BILANS, TABLE_STAGIAIRES, TABLE_TUTORATS, 'Rapports', 'Professeurs', 'Etablissements', 'Personnes', 'Types_rapport', 'Competences_MD', 'Parametres', 'Visites', 'Utilisateurs'];
  const lus = await Promise.all([...noms.map(lireTable), CHIFFREMENT ? lireTable(TABLE_CHIFFREMENT) : { lignes: [] }]);
  const T = Object.fromEntries(noms.map((n, i) => [n, lus[i]]));
  if (CHIFFREMENT && !cleLue) { cleLue = true; cle = await cleAuDemarrage(ligneChiffrementValide(lus[noms.length].lignes)); }
  moi = identifierMoi(T.Utilisateurs.lignes || []).moi;
  droits = droitsSuivi(droitsTable(moi, TABLE), droitsTable(moi, TABLE_BILANS));
  droitsStg = droitsStagiaires(droitsTable(moi, TABLE_STAGIAIRES), droitsTable(moi, TABLE_TUTORATS));
  peutPlanifier = droitsTable(moi, 'Visites').C === 'Oui';
  erreurMd = T[TABLE].erreur || T[TABLE_BILANS].erreur
    ? `Impossible de lire le suivi des MD : ${T[TABLE].erreur || T[TABLE_BILANS].erreur} — les tables Maitres_delegues et Bilans_MD n'existent pas encore (Installer → Créer la structure), ou tes droits ne permettent pas de les lire.`
    : droits.voir ? '' : 'Suivi des MD réservé aux IA-IPR et aux administrateur·trices.';
  erreurStg = T[TABLE_STAGIAIRES].erreur || T[TABLE_TUTORATS].erreur
    ? `Impossible de lire la liste des stagiaires : ${T[TABLE_STAGIAIRES].erreur || T[TABLE_TUTORATS].erreur} — les tables Stagiaires et Tutorats n'existent pas encore (Installer → Créer la structure, puis règles d'accès et « Appliquer les droits par défaut »), ou tes droits ne permettent pas de les lire.`
    : droitsStg.voir ? '' : 'Liste des stagiaires : pas de droit de lecture sur la table Stagiaires.';
  if (erreurMd && erreurStg && !droits.voir && !droitsStg.voir) {
    message('Écran réservé aux IA-IPR et aux administrateur·trices.', true);
    $('app').hidden = true; return;
  }
  D.mds = T[TABLE].lignes || [];
  D.bilans = erreurMd ? [] : await lignesLisibles(cle, TABLE_BILANS, T[TABLE_BILANS].lignes || [], CHIFFREMENT, cache);
  D.stagiaires = T[TABLE_STAGIAIRES].lignes || []; D.tutorats = T[TABLE_TUTORATS].lignes || [];
  D.rapports = await lignesLisibles(cle, 'Rapports', T.Rapports.lignes || [], CHIFFREMENT, cache);
  D.profs = T.Professeurs.lignes || []; D.etabs = T.Etablissements.lignes || []; D.personnes = T.Personnes.lignes || [];
  D.types = T.Types_rapport.lignes || []; D.competences = T.Competences_MD.lignes || []; D.visites = T.Visites.lignes || [];
  D.params = Object.fromEntries((T.Parametres.lignes || []).map(p => [String(p.Cle || ''), String(p.Valeur ?? '')]));
  if (!change([T[TABLE].lignes, T[TABLE_BILANS].lignes, T[TABLE_STAGIAIRES].lignes, T[TABLE_TUTORATS].lignes, T.Rapports.lignes, T.Visites.lignes, moi && moi.Droits, !!cle]) && !$('app').hidden) return;
  message(''); $('app').hidden = false;
  if (!occupe()) afficher();
});
async function ecrireBilans(actions, ok) {
  if (masque()) { toast(TIP_MASQUE + '.', true); return null; }
  return ecrire(await chiffrerActions(cle, actions, CHIFFREMENT), ok, charger);
}

// --- Affichage ---
function afficher() {
  document.querySelectorAll('#onglets [data-onglet]').forEach(b => b.classList.toggle('actif', b.dataset.onglet === onglet));
  if (onglet === 'pstg') { afficherPstg(); return; }
  if (erreurMd) { $('contenu').innerHTML = `<div class="alerte">${esc(erreurMd)}</div>`; return; }
  const t = typeMd();
  if (!t) { $('contenu').innerHTML = '<div class="alerte">Aucun type de rapport « MD » : Modèles &amp; phrases → Types de rapport.</div>'; return; }
  const donnees = { ...D, typeMd: t.id };
  const toutes = lignesSuivi(donnees, rentree);
  const lignes = filtrerMds(toutes, filtre);
  const n = compterEtats(toutes);
  const annees = anneesSuivi(rentree);
  const courante = libelleAnnee(rentree);
  const aAjouter = droits.ajouter ? mdsAAjouter(donnees) : [];
  const nv = niveaux();
  $('contenu').innerHTML = `
    ${masque() ? `<div class="alerte">${esc(TIP_MASQUE)}.</div>` : ''}
    ${aAjouter.length ? `<div class="ajouter"><span class="noms"><strong>${aAjouter.length} MD pas encore suivi·e${aAjouter.length > 1 ? 's' : ''}</strong> :
      ${aAjouter.map(x => `${esc(nomMd(x.champs))} <span class="muted">(${esc(x.source)})</span>`).join(', ')}</span>
      <button id="ajouter-tous" class="primary">Ajouter au suivi</button></div>` : ''}
    <div class="compteurs">${ETATS_MD.map(e => `<button data-etat="${e.cle}" class="c-${e.cle} ${filtre.etat === e.cle ? 'actif' : ''}"><b>${n[e.cle] || 0}</b><span>${esc(e.libelle)}</span></button>`).join('')}</div>
    <div class="outils">
      <input type="search" id="f-q" placeholder="Rechercher un·e MD, un établissement…" value="${esc(filtre.q)}">
      <label><input type="checkbox" id="f-anciens" ${filtre.anciens ? 'checked' : ''}> Afficher les ancien·nes MD</label>
      ${droits.ajouter ? '<button id="nouveau-md">+ MD</button>' : ''}
    </div>
    <div class="legende"><span>Ronds, dans l'ordre : ${grille().map((k, i) => `<strong>${i + 1}</strong>. ${esc(k.Libelle)}`).join(' · ') || 'grille MD vide'}</span></div>
    <div class="legende">${nv.map((x, i) => `<span><span class="rond" style="background:${couleurNiveau(i + 1, nv.length)}"></span> ${esc(x)}</span>`).join('')}
      <span><span class="rond"></span> non positionné</span><span><svg class="question" viewBox="0 0 24 24" aria-hidden="true">${IC_QUESTION}</svg> visite sans évaluation</span><span><span class="ronds" style="box-shadow:0 0 0 1.5px var(--accent) inset;border-radius:10px;padding:1px 6px">rapport</span> rapport de l'application ; sinon bilan saisi</span>
      <span>Visite tous les ${PERIODE_ANS} ans.</span></div>
    ${lignes.length ? `<table class="suivi"><thead><tr><th>MD</th>${annees.map(a => `<th class="${a === courante ? 'courante' : ''}">${esc(a.replace(/^20(\d\d)-20(\d\d)$/, '$1-$2'))}</th>`).join('')}
      <th>Dernière visite</th><th>État</th></tr></thead><tbody>
      ${lignes.map(l => `<tr class="${l.md.En_poste === false ? 'ancien' : ''}"><td class="nom" data-md="${l.md.id}" title="Fiche du ou de la MD">
        <span class="n">${esc(nomMd(l.md))}</span>${l.md.En_poste === false ? ' <span class="etiquette">ancien·ne</span>' : ''}
        <span class="det">${esc([l.md.Etab_nom, l.md.Etab_commune].filter(Boolean).join(', ') || l.md.UAI || '')}</span></td>
        ${annees.map(a => { const c = l.cases.get(a); const lecture = !c && !droits.saisir;
          return `<td class="case ${a === courante ? 'courante' : ''} ${c && c.source === 'rapport' ? 'rapport' : ''} ${lecture ? 'lecture' : ''}" data-case="${l.md.id}|${esc(a)}"
            ${c ? '' : `title="${esc(lecture ? 'Pas de visite' : `Pas de visite en ${a} : cliquer pour saisir un ancien bilan`)}"`}>${c ? ronds(c.positionnement, infobulle(c)) : '<span class="vide">·</span>'}</td>`; }).join('')}
        <td>${esc(derniereAnnee(l.cases) || '—')}</td>
        <td><span class="etiquette e-${l.etat.cle}">${esc(l.etat.libelle)}</span></td></tr>`).join('')}
      </tbody></table>` : `<p class="muted">${D.mds.length ? 'Aucun·e MD ne correspond aux filtres.' : 'Aucun·e MD suivi·e pour l\'instant : « Ajouter au suivi » ou « + MD ».'}</p>`}`;
}

// --- Suivi PSTG : liste des stagiaires de l'année (Stagiaires, Tutorats) ---
const nomStg = x => [x.Civilite, x.Nom, x.Prenom].filter(Boolean).join(' ');
const cmis = () => D.personnes.filter(p => p.Fonction === 'CMi').sort((a, b) => nomFiche(a).localeCompare(nomFiche(b), 'fr'));
const anneeStg = () => filtreStg.annee || libelleAnnee(rentree);
const codes = () => codesStagiaires(D.params);
// Visites du plan reliées à un·e stagiaire (une par CMi qui le ou la visite), avec leur état (même calcul que l'écran Plan).
function visitesEtats(s) {
  return visitesDe(D.visites, s.id).map(v => {
    const r = v.Rapport ? D.rapports.find(x => x.id === v.Rapport) : null;
    return { v, e: etatVisite(v, r, aujourdhui()) };
  });
}
function afficherPstg() {
  if (erreurStg) { $('contenu').innerHTML = `<div class="alerte">${esc(erreurStg)}</div>`; return; }
  const annee = anneeStg(), courante = libelleAnnee(rentree);
  const lignes = filtrerStagiaires(D.stagiaires, { ...filtreStg, annee }, D.personnes, D.visites);
  const tous = D.stagiaires.filter(s => s.Annee === annee);

    <div class="outils">

      <button id="stg-modele" title="Fichier CSV à faire compléter par les collègues (les stagiaires déjà connu·es de l'année y figurent)">⤓ Modèle CSV</button>
      ${droitsStg.ajouter ? '<button id="stg-importer" title="Reverser le fichier CSV complété">⤒ Importer un CSV</button>' : ''}

    ${lignes.length ? `<table class="stg"><thead><tr><th>Stagiaire</th><th>Statut</th><th>Tuteur·trice(s)</th><th>Visites au plan (CMi)</th><th>À compléter</th></tr></thead><tbody>
      ${lignes.map(s => { const t = tuteursDe(D.tutorats, s.id), vis = visitesEtats(s), m = manques(s, t, vis.map(x => x.v));
        return `<tr class="cliquable ${s.Suivi === 'Écarté·e' ? 'ecarte' : ''}" data-stg="${s.id}">
        <td><strong>${esc(nomStg(s))}</strong>${s.Professeur ? '' : ' <span class="etiquette" title="Absent·e du fichier des professeur·es">hors fichier</span>'}
          <span class="det">${esc([s.Etab_nom, s.Etab_commune].filter(Boolean).join(', ') || s.UAI || '')}</span></td>

        <td>${s.Sans_tuteur ? '<span class="muted">sans tuteur·trice</span>' : t.map(x => `${esc(`${x.Prenom} ${x.Nom}`)}<span class="det">${esc(x.Etab_nom || x.UAI || '')}${x.UAI && x.UAI !== s.UAI ? ' · autre établissement' : ''}</span>`).join('') || '—'}</td>
        <td>${vis.length ? vis.map(x => `<div>${esc(nomPers(x.v.CMi) || 'sans CMi')} <span class="etiquette" title="${esc(x.v.Date_prevue ? 'calée le ' + dateFr(x.v.Date_prevue) : 'à caler')}">${esc(x.e.libelle)}</span></div>`).join('') : '<span class="muted">—</span>'}</td>

// Fiche d'un·e stagiaire (ajout ou modification), avec ses tuteur·trices.
function ouvrirStagiaire(s, depart = {}) {
  const nouveau = !s || !s.id;
  if (nouveau ? !droitsStg.ajouter : false) return;
  const ecrit = nouveau ? droitsStg.ajouter : droitsStg.modifier;
  enCours = { stg: { ...(s || { Annee: anneeStg(), Professeur: 0, Civilite: '', Nom: '', Prenom: '', Email: '', UAI: '', Etab_nom: '', Etab_commune: '',
    Corps: '', Concours: '', Quotite: '', Sans_tuteur: false, Suivi: 'À suivre', Motif: '', Notes: '' }), ...depart },
    tuteurs: s && s.id ? tuteursDe(D.tutorats, s.id).map(t => ({ ...t })) : [], retires: [] };
  dessinerStagiaire(nouveau, ecrit);
  $('dlg-stg').showModal();
}
function dessinerStagiaire(nouveau, ecrit) {
  const x = enCours.stg;
  const dis = ecrit ? '' : 'disabled';
  const champ = (id, lib, v) => `<label class="champ"><span>${lib}</span><input type="text" id="s-${id}" value="${esc(v ?? '')}" ${dis}></label>`;
  const choix = (id, lib, liste, v) => `<label class="champ"><span>${lib}</span><select id="s-${id}" ${dis}><option value=""></option>${liste.map(c => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`;
  const lie = x.Professeur && D.profs.find(p => p.id === x.Professeur);
  $('f-stg').innerHTML = `
    <h2>${nouveau ? 'Ajouter un·e stagiaire' : esc(nomStg(x))} <span class="muted petit">${esc(x.Annee)}</span></h2>
    ${nouveau ? `<label class="champ"><span>Chercher dans le fichier des professeur·es (sinon, saisir ci-dessous)</span>
      <input type="search" id="s-q" placeholder="Nom, prénom, établissement ou UAI…"></label><div id="s-sugg"></div>` : ''}
    <p class="petit muted" id="s-lien">${lie ? `Relié·e au fichier : ${esc(lie.Libelle || `${lie.Nom} ${lie.Prenom}`)} · ${esc(lie.Grade || '')} · ${esc(lie.Type_nomination || '')}` : 'Non relié·e au fichier des professeur·es de l\'année.'}</p>
    <div class="grille">
      <label class="champ"><span>Civilité</span><select id="s-Civilite" ${dis}>${['', 'M.', 'Mme'].map(c => `<option ${c === x.Civilite ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      ${champ('Nom', 'Nom', x.Nom)}${champ('Prenom', 'Prénom', x.Prenom)}${champ('Email', 'E-mail', x.Email)}
      ${champ('UAI', 'UAI', x.UAI)}${champ('Etab_nom', 'Établissement', x.Etab_nom)}${champ('Etab_commune', 'Commune', x.Etab_commune)}
      ${choix('Corps', 'Corps', CORPS, x.Corps)}${choix('Concours', 'Concours', CONCOURS, x.Concours)}${choix('Quotite', 'Quotité', QUOTITES, x.Quotite)}
      ${choix('Suivi', 'Suivi', SUIVIS, x.Suivi || 'À suivre')}
    </div>
    <label class="champ" id="s-motif-l" ${x.Suivi === 'Écarté·e' ? '' : 'hidden'}><span>Motif (écarté·e)</span><input type="text" id="s-Motif" value="${esc(x.Motif || '')}" placeholder="Autre discipline, renouvellement suivi ailleurs…" ${dis}></label>
    <h3 style="font-size:14px;margin:12px 0 2px">Tuteur·trice(s)</h3>
    <label class="petit"><input type="checkbox" id="s-Sans_tuteur" ${x.Sans_tuteur ? 'checked' : ''} ${dis}> Sans tuteur·trice (agrégation interne…)</label>
    <div class="tuteurs-liste" id="s-tuteurs">${enCours.tuteurs.map((t, i) => `<div><span><strong>${i + 1}.</strong> ${esc(`${t.Civilite ? t.Civilite + ' ' : ''}${t.Prenom} ${t.Nom}`)}
      <span class="muted">— ${esc(t.Etab_nom || t.UAI || '')}${t.Email ? ' · ' + esc(t.Email) : ''}${t.Professeur ? '' : ' · hors fichier'}</span></span>
      ${ecrit && droitsStg.tuteurs ? `<button type="button" class="petit" data-retirer="${i}" title="Retirer">×</button>` : ''}</div>`).join('') || '<span class="muted petit">Aucun·e.</span>'}</div>
    ${ecrit && droitsStg.tuteurs && enCours.tuteurs.length < 2 ? `<label class="champ"><span>Ajouter un·e tuteur·trice (même établissement proposé d'abord)</span>
      <input type="search" id="s-tq" placeholder="Nom du ou de la professeur·e…"></label><div id="s-tsugg"></div>` : ''}
    ${nouveau ? '' : `<h3 style="font-size:14px;margin:12px 0 2px">Visites au plan</h3>
    <div class="tuteurs-liste">${visitesEtats(x).map(y => `<div><span>${esc(nomPers(y.v.CMi) || 'sans CMi')} <span class="muted">— ${esc(y.e.libelle)}${y.v.Date_prevue ? ' · le ' + esc(dateFr(y.v.Date_prevue)) : ''}</span></span></div>`).join('') || '<span class="muted petit">Aucune.</span>'}</div>
    ${peutPlanifier ? `<div class="outils"><select id="s-cmi-visite"><option value="0">Ajouter une visite au plan avec…</option>${cmis().map(p => `<option value="${p.id}">${esc(nomFiche(p))}</option>`).join('')}</select>
      <button type="button" id="s-visite">+ Visite</button></div>` : ''}`}
    <label class="champ"><span>Notes</span><textarea id="s-Notes" ${dis}>${esc(x.Notes || '')}</textarea></label>
    <div class="actions">
      ${ecrit ? `<button type="button" id="s-ok" class="primary">${nouveau ? 'Ajouter' : 'Enregistrer'}</button>` : ''}
      ${!nouveau && droitsStg.supprimer ? `<button type="button" id="s-suppr" class="danger" title="Supprimer de la liste (double clic) ; pour ne plus suivre, préférer « Écarté·e »">Supprimer</button>` : ''}
      <button type="button" id="s-fermer">Fermer</button>
    </div>`;
  const lire = () => {   // garde la saisie en cours quand la fenêtre est redessinée (ajout ou retrait d'un·e tuteur·trice)
    if (!$('s-Nom')) return;
    for (const k of ['Nom', 'Prenom', 'Email', 'UAI', 'Etab_nom', 'Etab_commune', 'Motif', 'Notes']) x[k] = $(`s-${k}`).value.trim();
    for (const k of ['Civilite', 'Corps', 'Concours', 'Quotite', 'Suivi']) x[k] = $(`s-${k}`).value;
    x.Sans_tuteur = $('s-Sans_tuteur').checked; x.UAI = x.UAI.toUpperCase();
  };
  $('s-Suivi').addEventListener('change', () => { $('s-motif-l').hidden = $('s-Suivi').value !== 'Écarté·e'; });
  if ($('s-UAI') && ecrit) $('s-UAI').addEventListener('change', () => {
    const e = D.etabs.find(y => norm(y.UAI) === norm($('s-UAI').value));
    if (e) { $('s-Etab_nom').value = e.Nom || ''; $('s-Etab_commune').value = e.Commune || ''; }
  });
  const chercher = (q, uai) => q.length < 2 ? [] : D.profs.filter(p => norm(`${p.Nom} ${p.Prenom} ${p.UAI} ${(D.etabs.find(e => e.UAI === p.UAI) || {}).Nom || ''}`).includes(q))
    .sort((a, b) => Number(b.UAI === uai) - Number(a.UAI === uai)).slice(0, 12);
  const sugg = (res, attr) => res.length ? `<div class="suggestions">${res.map(p => `<div data-${attr}="${p.id}">${esc(`${p.Nom} ${p.Prenom}`)} <span class="muted">— ${esc((D.etabs.find(e => e.UAI === p.UAI) || {}).Nom || p.UAI || '')} · ${esc(p.Grade || '')}${p.Type_nomination ? ' · ' + esc(p.Type_nomination) : ''}</span></div>`).join('')}</div>` : '';
  if ($('s-q')) $('s-q').addEventListener('input', () => { $('s-sugg').innerHTML = sugg(chercher(norm($('s-q').value), ''), 'prof'); });
  if ($('s-sugg')) $('s-sugg').addEventListener('click', e => {
    const d = e.target.closest('[data-prof]');
    if (!d) return;
    lire();
    const p = D.profs.find(y => y.id === Number(d.dataset.prof));
    const c = ligneStagiaire(p, D.etabs, x.Annee);
    for (const k of ['Professeur', 'Civilite', 'Nom', 'Prenom', 'Email', 'UAI', 'Etab_nom', 'Etab_commune']) x[k] = c[k];
    if (!x.Corps) x.Corps = c.Corps;
    dessinerStagiaire(nouveau, ecrit);
  });
  if ($('s-tq')) {
    $('s-tq').addEventListener('input', () => {
      const q = norm($('s-tq').value);
      const res = chercher(q, $('s-UAI').value.trim().toUpperCase());
      $('s-tsugg').innerHTML = sugg(res, 'tuteur') + (q.length >= 2 ? `<button type="button" class="petit" id="s-tlibre">+ Ajouter « ${esc($('s-tq').value.trim())} » hors fichier</button>` : '');
    });
    $('s-tsugg').addEventListener('click', e => {
      const d = e.target.closest('[data-tuteur]');
      if (d) { lire(); enCours.tuteurs.push({ ...ligneTuteur(D.profs.find(y => y.id === Number(d.dataset.tuteur)), D.etabs), id: 0 }); x.Sans_tuteur = false; dessinerStagiaire(nouveau, ecrit); return; }
      if (e.target.closest('#s-tlibre')) {
        lire();
        const mots = $('s-tq').value.trim().split(/\s+/);
        enCours.tuteurs.push({ ...ligneTuteur(null, D.etabs, { nom: mots[0] || '', prenom: mots.slice(1).join(' '), uai: '' }), id: 0 });
        x.Sans_tuteur = false; dessinerStagiaire(nouveau, ecrit);
      }
    });
  }
  if ($('s-visite')) $('s-visite').addEventListener('click', async () => {
    const cmi = Number($('s-cmi-visite').value) || 0;
    if (!cmi) return toast('Choisir le ou la CMi de la visite.', true);
    const res = await ecrire([['AddRecord', 'Visites', null, visitePour(x, cmi)]], `Visite ajoutée au plan (${nomPers(cmi)}) : période à caler dans l'écran Plan`, charger);
    if (res) { lire(); dessinerStagiaire(nouveau, ecrit); }
  });
  $('s-tuteurs').addEventListener('click', e => {
    const b = e.target.closest('[data-retirer]');
    if (!b) return;
    lire();
    const [t] = enCours.tuteurs.splice(Number(b.dataset.retirer), 1);
    if (t && t.id) enCours.retires.push(t.id);
    dessinerStagiaire(nouveau, ecrit);
  });
  if ($('s-ok')) $('s-ok').addEventListener('click', async () => {
    lire();
    const champs = { ...x };
    delete champs.id; delete champs.Libelle; delete champs.manualSort;
    const pb = validerStagiaire(champs);
    if (pb) return toast(pb, true);
    if (nouveau && D.stagiaires.some(y => y.Annee === champs.Annee && norm(y.Nom) === norm(champs.Nom) && norm(y.Prenom) === norm(champs.Prenom)))
      return toast(`${champs.Nom} ${champs.Prenom} est déjà dans la liste ${champs.Annee}.`, true);
    const tuteurs = enCours.tuteurs, retires = enCours.retires, id0 = x.id;
    fermer('dlg-stg');
    const res = await ecrire([nouveau ? ['AddRecord', TABLE_STAGIAIRES, null, champs] : ['UpdateRecord', TABLE_STAGIAIRES, id0, champs]]);
    if (!res) return;
    const id = nouveau ? res.retValues[0] : id0;
    const actions = [...retires.map(t => ['RemoveRecord', TABLE_TUTORATS, t]),
      ...tuteurs.map((t, i) => (t.id ? ['UpdateRecord', TABLE_TUTORATS, t.id, { Ordre: i + 1 }]
        : ['AddRecord', TABLE_TUTORATS, null, { Stagiaire: id, Professeur: t.Professeur || 0, Civilite: t.Civilite, Nom: t.Nom, Prenom: t.Prenom,
          Email: t.Email, UAI: t.UAI, Etab_nom: t.Etab_nom, Ordre: i + 1 }]))];
    if (actions.length) await ecrire(actions);
    toast(nouveau ? 'Stagiaire ajouté·e' : 'Fiche enregistrée');
    await charger();
  });
  if ($('s-suppr')) boutonConfirmation($('s-suppr'), 'Confirmer la suppression', async () => {
    const id = x.id;
    fermer('dlg-stg');
    await ecrire([...tuteursDe(D.tutorats, id).map(t => ['RemoveRecord', TABLE_TUTORATS, t.id]), ['RemoveRecord', TABLE_STAGIAIRES, id]], 'Stagiaire supprimé·e', charger);
  });
  $('s-fermer').addEventListener('click', () => fermer('dlg-stg'));
}

// Import du fichier CSV complété : aperçu, puis création ou complément des fiches et des tuteur·trices.
async function importerCsv(fichier) {
  const texte = await fichier.text();
  const l = lireCsvStagiaires(texte);
  if (l.erreur) { toast(l.erreur, true); return; }
  const annee = anneeStg();
  const prep = preparerImportStagiaires(l.lignes, { stagiaires: D.stagiaires, tutorats: D.tutorats, profs: D.profs, etabs: D.etabs, personnes: D.personnes, annee, visites: D.visites });
  enCours = { prep };
  const plus = p => [p.tuteurs.length ? `${p.tuteurs.length} tuteur·trice${p.tuteurs.length > 1 ? 's' : ''}` : '',
    p.cmis.length ? (peutPlanifier ? `visite au plan : ${p.cmis.map(nomPers).join(', ')}` : 'visites non créées (pas de droit sur le plan)') : ''].filter(Boolean).join(' ; ');
  const action = p => p.ignoree ? p.ignoree : `${p.id ? 'compléter' : 'créer'}${plus(p) ? ` (+ ${plus(p)})` : ''}`;
  const utiles = prep.filter(p => !p.ignoree);
  $('f-import').innerHTML = `<h2>Importer les stagiaires ${esc(annee)}</h2>
    <p class="petit muted">${esc(fichier.name)} : ${prep.length} ligne${prep.length > 1 ? 's' : ''}. Une fiche existante n'est que complétée (cases vides) ; rien n'est écrasé.</p>
    <div class="apercu-import"><table><thead><tr><th>Ligne</th><th>Stagiaire</th><th>Action</th></tr></thead><tbody>
      ${prep.map(p => `<tr><td>${p.n}</td><td>${esc(p.libelle)}${p.alertes.map(a => `<span class="alerte-l">⚠ ${esc(a)}</span>`).join('')}</td><td>${esc(action(p))}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="actions">${utiles.length ? `<button type="button" id="i-ok" class="primary">Importer ${utiles.length} ligne${utiles.length > 1 ? 's' : ''}</button>` : ''}
      <button type="button" id="i-fermer">Fermer</button></div>`;
  if ($('i-ok')) $('i-ok').addEventListener('click', async () => {
    fermer('dlg-import');
    const nouveaux = utiles.filter(p => !p.id), maj = utiles.filter(p => p.id && p.champs && Object.keys(p.champs).length);
    const res = nouveaux.length ? await ecrire(nouveaux.map(p => ['AddRecord', TABLE_STAGIAIRES, null, p.champs])) : { retValues: [] };
    if (!res) return;
    const idDe = p => (p.id ? p.id : res.retValues[nouveaux.indexOf(p)]);
    const actions = [...maj.map(p => ['UpdateRecord', TABLE_STAGIAIRES, p.id, p.champs]),
      ...utiles.flatMap(p => p.tuteurs.map(t => ['AddRecord', TABLE_TUTORATS, null, { ...t, Stagiaire: idDe(p) }])),
      ...(peutPlanifier ? utiles.flatMap(p => p.cmis.map(c => ['AddRecord', 'Visites', null, visitePour({ ...(p.id ? D.stagiaires.find(y => y.id === p.id) : {}), ...p.champs, id: idDe(p) }, c)])) : [])];
    if (actions.length) await ecrire(actions);
    toast(`${nouveaux.length} stagiaire${nouveaux.length > 1 ? 's' : ''} créé·e${nouveaux.length > 1 ? 's' : ''}, ${maj.length} complété·e${maj.length > 1 ? 's' : ''}`);
    await charger();
  });
  $('i-fermer').addEventListener('click', () => fermer('dlg-import'));
  $('dlg-import').showModal();
}

// Mise au plan des stagiaires sans visite : un·e CMi à choisir pour chacun·e (vide = plus tard).
function ouvrirMiseAuPlan() {
  const liste = sansVisite(D.stagiaires, D.visites, anneeStg());
  enCours = { plan: liste };
  $('f-plan').innerHTML = `<h2>Mettre au plan d'inspection</h2>
    <p class="petit muted">Une visite par stagiaire avec le ou la CMi choisi·e (laisser vide pour plus tard). D'autres visites, avec d'autres CMi,
      s'ajoutent depuis la fiche du ou de la stagiaire ou dans l'écran Plan, où se cale aussi la période.</p>
    <div class="apercu-import"><table><tbody>${liste.map(x => `<tr><td>${esc(nomStg(x))}<span class="alerte-l" style="color:var(--muted)">${esc([x.Etab_nom, statutStagiaire(x)].filter(Boolean).join(' · '))}</span></td>
      <td><select data-plan="${x.id}"><option value="0">—</option>${cmis().map(p => `<option value="${p.id}">${esc(nomFiche(p))}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
    <div class="actions"><button type="button" id="p-ok" class="primary">Créer les visites</button><button type="button" id="p-fermer">Fermer</button></div>`;
  $('p-ok').addEventListener('click', async () => {
    const actions = [...$('f-plan').querySelectorAll('[data-plan]')].filter(x => Number(x.value))
      .map(x => ['AddRecord', 'Visites', null, visitePour(liste.find(y => y.id === Number(x.dataset.plan)), Number(x.value))]);
    if (!actions.length) return toast('Choisir au moins un·e CMi.', true);
    fermer('dlg-plan');
    await ecrire(actions, `${actions.length} visite${actions.length > 1 ? 's' : ''} ajoutée${actions.length > 1 ? 's' : ''} au plan (période à caler dans l'écran Plan)`, charger);
  });
  $('p-fermer').addEventListener('click', () => fermer('dlg-plan'));
  $('dlg-plan').showModal();
}

// --- Fenêtre d'un bilan (case MD × année) ---
function ouvrirBilan(mdId, annee) {
  const md = D.mds.find(m => m.id === mdId);
  if (!md) return;
  const l = lignesSuivi({ ...D, mds: [md], typeMd: typeMd().id }, rentree)[0];
  const c = l.cases.get(annee);
  const nv = niveaux(), g = grille();
  const rapport = c && c.source === 'rapport';
  const saisie = c && c.source === 'saisie' ? c.bilan : c && c.saisie;
  if (!c && !droits.saisir) return;
  enCours = { md, annee, rapport: rapport ? c.rapport : null, bilan: rapport ? null : saisie || null,
    pos: JSON.stringify(c && !rapport ? c.positionnement : {}), visiteur: c && !rapport ? c.visiteur : 0, date: c && !rapport ? c.date : null };
  const ecrit = !rapport && !masque() && (saisie ? droits.corriger : droits.saisir);
  const choix = D.personnes.filter(p => ['CMi', 'IA-IPR'].includes(p.Fonction) || p.id === enCours.visiteur).sort((a, b) => nomFiche(a).localeCompare(nomFiche(b), 'fr'));
  const pos = rapport ? c.positionnement : lirePositionnement(enCours.pos);
  const cal = calendrierAnnee(annee);
  $('f-bilan').innerHTML = `
    <h2>${esc(nomMd(md))} — ${esc(annee)}</h2>
    <p class="petit muted">${rapport ? `Bilan tiré du rapport du ${esc(dateFr(c.date))} (${esc(c.rapport.Statut)}), rédigé par ${esc(nomPers(c.visiteur)) || '—'} : lecture seule.`
      : saisie ? 'Bilan saisi (ancienne visite).' : 'Noter une ancienne visite : date et visiteur·e ; niveaux et phrases si on les connaît (sinon, « ? » dans le tableau).'}</p>
    ${masque() ? `<div class="alerte">${esc(TIP_MASQUE)}.</div>` : ''}
    ${rapport ? '' : `<div class="grille">
      <label class="champ"><span>Visité·e par</span><select id="b-visiteur" ${ecrit ? '' : 'disabled'}><option value="0">—</option>${choix.map(p => `<option value="${p.id}" ${p.id === enCours.visiteur ? 'selected' : ''}>${esc(nomFiche(p))} (${esc(p.Fonction || '')})</option>`).join('')}</select></label>
      <label class="champ"><span>Date de la visite</span><input type="date" id="b-date" value="${esc(dateIso(enCours.date))}"
        min="${cal.min}" max="${cal.max}" ${ecrit ? '' : 'disabled'}></label>
    </div>`}
    ${g.map(k => { const x = pos[k.Code] || { niveau: '', phrase: '' }; const d = descripteurs(k.Descripteurs, nv);
      return `<div class="comp"><h3>${esc(k.Libelle)}</h3>
      <div class="niveaux">${nv.map((n, i) => `<label class="${x.niveau === n ? 'choisi' : ''}" style="--niv:${couleurNiveau(i + 1, nv.length)}" title="${esc(d[n] || '')}">
        <input type="radio" name="b-${esc(k.Code)}" data-niv="${esc(k.Code)}" value="${esc(n)}" ${x.niveau === n ? 'checked' : ''} ${ecrit ? '' : 'disabled'}> ${esc(n)}</label>`).join('')}</div>
      ${ecrit ? `<textarea data-phrase="${esc(k.Code)}" placeholder="Phrase de bilan (facultative) : une phrase d'illustration est proposée au choix du niveau">${esc(x.phrase)}</textarea>`
        : x.phrase ? `<div class="phrase">${esc(x.phrase)}</div>` : ''}</div>`; }).join('')}
    ${rapport && saisie ? '<div class="alerte petit">Un bilan saisi existe aussi pour cette année ; le rapport l\'emporte dans le tableau.</div>' : ''}
    <div class="actions">
      ${rapport ? `<button type="button" id="b-rapport" class="primary">Ouvrir le rapport</button>` : ''}
      ${ecrit ? '<button type="button" id="b-ok" class="primary">Enregistrer</button>' : ''}
      ${saisie && droits.effacer && !masque() ? '<button type="button" id="b-suppr" class="danger">Supprimer le bilan saisi</button>' : ''}
      <button type="button" id="b-fermer">Fermer</button>
    </div>`;
  const f = $('f-bilan');
  const illustrations = code => descripteurs((D.competences.find(k => k.Code === code) || {}).Phrases_types, nv);
  f.querySelectorAll('[data-niv]').forEach(i => i.addEventListener('change', () => {
    i.closest('.niveaux').querySelectorAll('label').forEach(x => x.classList.toggle('choisi', x.contains(i)));
    enCours.pos = positionner(enCours.pos, i.dataset.niv, { niveau: i.value }, illustrations(i.dataset.niv));
    const t = f.querySelector(`[data-phrase="${CSS.escape(i.dataset.niv)}"]`);
    if (t) t.value = lirePositionnement(enCours.pos)[i.dataset.niv].phrase;
  }));
  f.querySelectorAll('[data-phrase]').forEach(t => t.addEventListener('input', () => { enCours.pos = positionner(enCours.pos, t.dataset.phrase, { phrase: t.value }); }));
  // Calendrier ouvert sur novembre de l'année de rentrée : date provisoire, retirée si rien n'est choisi.
  const dt = $('b-date');
  if (dt && !dt.disabled) {
    const proposer = () => { if (!dt.value && cal.ouverture) { dt.value = cal.ouverture; dt.dataset.provisoire = '1'; } };
    dt.addEventListener('pointerdown', proposer);
    dt.addEventListener('focus', proposer);
    dt.addEventListener('input', () => { delete dt.dataset.provisoire; });
    dt.addEventListener('change', () => { delete dt.dataset.provisoire; });
    dt.addEventListener('blur', () => { if (dt.dataset.provisoire) { dt.value = ''; delete dt.dataset.provisoire; } });
  }
  if ($('b-rapport')) $('b-rapport').addEventListener('click', () => { const id = c.rapport.id; fermer('dlg-bilan'); ouvrirRapports({ rapport: id }); });
  if ($('b-ok')) $('b-ok').addEventListener('click', enregistrerBilan);
  if ($('b-suppr')) boutonConfirmation($('b-suppr'), 'Confirmer la suppression', async () => {
    const id = saisie.id; fermer('dlg-bilan');
    await ecrireBilans([['RemoveRecord', TABLE_BILANS, id]], 'Bilan supprimé');
  });
  $('b-fermer').addEventListener('click', () => fermer('dlg-bilan'));
  $('dlg-bilan').showModal();
}
async function enregistrerBilan() {
  const b = enCours;
  const visiteur = Number($('b-visiteur').value) || null;
  const pos = lirePositionnement(b.pos);
  const dt = $('b-date'), date = dt.dataset.provisoire ? null : isoVersGrist(dt.value) || null;
  const pb = validerBilan({ annee: b.annee, visiteur, date, positionnement: pos }, rentree);
  if (pb) return toast(pb, true);
  const champs = { MD: b.md.id, Annee: b.annee, Visiteur: visiteur, Date_visite: date, Positionnement: JSON.stringify(pos) };
  fermer('dlg-bilan');
  await ecrireBilans([b.bilan ? ['UpdateRecord', TABLE_BILANS, b.bilan.id, champs] : ['AddRecord', TABLE_BILANS, null, champs]], 'Bilan enregistré');
}

// --- Fiche d'un·e MD (ajout ou modification) ---
function ouvrirMd(md) {
  const nouveau = !md;
  if (nouveau ? !droits.ajouter : !droits.modifier && !droits.supprimer) return;
  enCours = { md: md ? { ...md } : { Professeur: null, Civilite: '', Nom: '', Prenom: '', UAI: '', Etab_nom: '', Etab_commune: '', En_poste: true, Notes: '' } };
  const m = enCours.md;
  const saisis = md ? D.bilans.filter(b => b.MD === md.id).length : 0;
  const lie = m.Professeur && D.profs.find(p => p.id === m.Professeur);
  const ecrit = nouveau || droits.modifier;
  const champ = (id, lib, v) => `<label class="champ"><span>${lib}</span><input type="text" id="m-${id}" value="${esc(v ?? '')}" ${ecrit ? '' : 'disabled'}></label>`;
  $('f-md').innerHTML = `
    <h2>${nouveau ? 'Ajouter un·e MD' : esc(nomMd(m))}</h2>
    ${nouveau ? `<label class="champ"><span>Chercher dans le fichier des professeur·es (facultatif : sinon, saisir ci-dessous)</span>
      <input type="search" id="m-q" placeholder="Nom, prénom, établissement ou UAI…"></label><div id="m-sugg"></div>` : ''}
    <p class="petit muted" id="m-lien">${lie ? `Relié·e au fichier des professeur·es : ${esc(lie.Libelle || `${lie.Nom} ${lie.Prenom}`)}` : 'Non relié·e au fichier des professeur·es de l\'année.'}</p>
    <div class="grille">
      <label class="champ"><span>Civilité</span><select id="m-Civilite" ${ecrit ? '' : 'disabled'}>${['', 'M.', 'Mme'].map(c => `<option ${c === m.Civilite ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      ${champ('Nom', 'Nom', m.Nom)}${champ('Prenom', 'Prénom', m.Prenom)}${champ('UAI', 'UAI', m.UAI)}${champ('Etab_nom', 'Établissement', m.Etab_nom)}${champ('Etab_commune', 'Commune', m.Etab_commune)}
    </div>
    <label class="petit"><input type="checkbox" id="m-En_poste" ${m.En_poste !== false ? 'checked' : ''} ${ecrit ? '' : 'disabled'}> En poste (décoché : ancien·ne MD, masqué·e par défaut)</label>
    <label class="champ"><span>Notes</span><textarea id="m-Notes" ${ecrit ? '' : 'disabled'}>${esc(m.Notes || '')}</textarea></label>
    <div class="actions">
      ${ecrit ? `<button type="button" id="m-ok" class="primary">${nouveau ? 'Ajouter' : 'Enregistrer'}</button>` : ''}
      ${!nouveau && droits.supprimer ? `<button type="button" id="m-suppr" class="danger ${saisis ? 'inactif' : ''}" title="${saisis ? `${saisis} bilan(s) saisi(s) : les supprimer d'abord, ou décocher « En poste »` : 'Retirer du suivi (double clic)'}">Retirer du suivi</button>` : ''}
      <button type="button" id="m-fermer">Fermer</button>
    </div>`;
  if ($('m-q')) $('m-q').addEventListener('input', () => {
    const q = norm($('m-q').value);
    const res = q.length < 2 ? [] : D.profs.filter(p => norm(`${p.Nom} ${p.Prenom} ${p.UAI} ${(D.etabs.find(e => e.UAI === p.UAI) || {}).Nom || ''}`).includes(q))
      .sort((a, b) => Number(estMd(b)) - Number(estMd(a))).slice(0, 12);
    $('m-sugg').innerHTML = res.length ? `<div class="suggestions">${res.map(p => `<div data-prof="${p.id}">${esc(`${p.Nom} ${p.Prenom}`)} <span class="muted">— ${esc(p.UAI || '')} · ${esc(p.Grade || '')}</span></div>`).join('')}</div>` : '';
  });
  if ($('m-sugg')) $('m-sugg').addEventListener('click', e => {
    const d = e.target.closest('[data-prof]');
    if (!d) return;
    const p = D.profs.find(x => x.id === Number(d.dataset.prof));
    const champs = ligneMd({ ...identiteProf(p), civilite: p.Civilite }, D.etabs);
    Object.assign(enCours.md, champs);
    for (const k of ['Nom', 'Prenom', 'UAI', 'Etab_nom', 'Etab_commune']) $(`m-${k}`).value = champs[k];
    $('m-Civilite').value = champs.Civilite;
    $('m-lien').textContent = `Relié·e au fichier des professeur·es : ${p.Nom} ${p.Prenom} – ${p.UAI}`;
    $('m-sugg').innerHTML = '';
  });
  if ($('m-UAI') && ecrit) $('m-UAI').addEventListener('change', () => {
    const e = D.etabs.find(x => norm(x.UAI) === norm($('m-UAI').value));
    if (e) { $('m-Etab_nom').value = e.Nom || ''; $('m-Etab_commune').value = e.Commune || ''; }
  });
  if ($('m-ok')) $('m-ok').addEventListener('click', async () => {
    const champs = { Professeur: enCours.md.Professeur || null, Civilite: $('m-Civilite').value, En_poste: $('m-En_poste').checked, Notes: $('m-Notes').value.trim() };
    for (const k of ['Nom', 'Prenom', 'UAI', 'Etab_nom', 'Etab_commune']) champs[k] = $(`m-${k}`).value.trim();
    champs.UAI = champs.UAI.toUpperCase();
    const pb = validerMd(champs);
    if (pb) return toast(pb, true);
    fermer('dlg-md');
    await ecrire([nouveau ? ['AddRecord', TABLE, null, champs] : ['UpdateRecord', TABLE, md.id, champs]], nouveau ? 'MD ajouté·e au suivi' : 'Fiche enregistrée', charger);
  });
  if ($('m-suppr') && !saisis) boutonConfirmation($('m-suppr'), 'Confirmer le retrait', async () => {
    fermer('dlg-md');
    await ecrire([['RemoveRecord', TABLE, md.id]], 'MD retiré·e du suivi', charger);
  });
  $('m-fermer').addEventListener('click', () => fermer('dlg-md'));
  $('dlg-md').showModal();
}
function fermer(id) { $(id).close(); enCours = null; afficher(); }
function ouvrirRapports(demande) {
  const h = hoteEcran('rapports');
  if (!h || !h.ouvrirEcran) { toast('Ouvrir l\'écran Rapports depuis le menu de l\'application.', true); return; }
  h.ouvrirEcran('rapports', demande);
}

if (await initialiserGrist()) {
  grist.ready({ requiredAccess: 'full', allowSelectBy: false });
  grist.onRecords(regrouper(charger));
  installerBulles();
  if (CHIFFREMENT) suivreCle(k => { cle = k; cache.clear(); charger(); });
  $('recharger').addEventListener('click', () => relireSansCache(charger));
  $('onglets').addEventListener('click', e => { const b = e.target.closest('[data-onglet]'); if (b) { onglet = b.dataset.onglet; pref.ecrire('Onglet', onglet); afficher(); } });
  $('contenu').addEventListener('click', async e => {
    const t = e.target;
    const et = t.closest('[data-etat]');
    if (et) { filtre.etat = filtre.etat === et.dataset.etat ? '' : et.dataset.etat; afficher(); return; }
    if (t.closest('#nouveau-md')) { ouvrirMd(null); return; }
    if (t.closest('#ajouter-tous')) {
      const a = mdsAAjouter({ ...D, typeMd: typeMd().id });
      if (a.length) await ecrire(a.map(x => ['AddRecord', TABLE, null, x.champs]), `${a.length} MD ajouté·e${a.length > 1 ? 's' : ''} au suivi`, charger);
      return;
    }
    const c = t.closest('td.case[data-case]');
    if (c) { const [id, annee] = c.dataset.case.split('|'); ouvrirBilan(Number(id), annee); return; }
    const n = t.closest('td.nom[data-md]');
    if (n) { ouvrirMd(D.mds.find(m => m.id === Number(n.dataset.md))); return; }
    // Suivi PSTG
    const annee = anneeStg();
    const profDe = id => D.profs.find(p => p.id === Number(id));
    if (t.closest('[data-ajout]')) {
      const p = profDe(t.closest('[data-ajout]').dataset.ajout);
      await ecrire([['AddRecord', TABLE_STAGIAIRES, null, ligneStagiaire(p, D.etabs, annee)]], 'Stagiaire ajouté·e : compléter sa fiche', charger);
      return;
    }
    if (t.closest('[data-ecarter]')) { ouvrirStagiaire(ligneStagiaire(profDe(t.closest('[data-ecarter]').dataset.ecarter), D.etabs, annee), { Suivi: 'Écarté·e' }); return; }
    if (t.closest('#stg-ajouter-tous')) {
      const a = stagiairesAAjouter({ stagiaires: D.stagiaires, profs: D.profs, etabs: D.etabs, codes: codes(), annee });
      if (a.length) await ecrire(a.map(x => ['AddRecord', TABLE_STAGIAIRES, null, x.champs]), `${a.length} stagiaire${a.length > 1 ? 's' : ''} ajouté·e${a.length > 1 ? 's' : ''} à la liste`, charger);
      return;
    }
    if (t.closest('#stg-plan')) { ouvrirMiseAuPlan(); return; }
    if (t.closest('#stg-nouveau')) { ouvrirStagiaire(null); return; }
    if (t.closest('#stg-modele')) {
      const liste = D.stagiaires.filter(x => x.Annee === annee && x.Suivi !== 'Écarté·e');
      telechargerFichier(`stagiaires-${annee}.csv`, csvModele(liste, D.tutorats, D.personnes, D.visites), 'text/csv;charset=utf-8');
      return;
    }
    if (t.closest('#stg-importer')) { $('fichier-csv').value = ''; $('fichier-csv').click(); return; }
    const r = t.closest('tr[data-stg]');
    if (r) { ouvrirStagiaire(D.stagiaires.find(x => x.id === Number(r.dataset.stg))); return; }
  });
  $('fichier-csv').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importerCsv(f); });
  $('contenu').addEventListener('change', e => {
    if (e.target.id === 'f-anciens') { filtre.anciens = e.target.checked; pref.ecrire('Anciens', filtre.anciens ? '1' : '0'); afficher(); }
    if (e.target.id === 'stg-ecartes') { filtreStg.ecartes = e.target.checked; pref.ecrire('Ecartes', filtreStg.ecartes ? '1' : '0'); afficher(); }
    if (e.target.id === 'stg-annee') { filtreStg.annee = e.target.value; afficher(); }
  });
  $('contenu').addEventListener('input', e => {
    const id = e.target.id;
    if (id !== 'f-q' && id !== 'stg-q') return;
    if (id === 'f-q') filtre.q = e.target.value; else filtreStg.q = e.target.value;
    const p = e.target.selectionStart; afficher(); $(id).focus(); $(id).setSelectionRange(p, p);
  });
  ['dlg-bilan', 'dlg-md', 'dlg-stg', 'dlg-import', 'dlg-plan'].forEach(id => $(id).addEventListener('cancel', () => { enCours = null; }));
  relectureReguliere(charger, occupe);
  await charger();
}
</script>
</body>
